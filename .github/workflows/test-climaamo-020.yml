name: test-climaamo-021

on:
  pull_request:
    branches: [main]
    paths:
      - 'factoryamo-builds/FAMO-20260822-201753-13807/ClimaAMO/**'
      - 'climaamo-ci/**'
      - '.github/workflows/test-climaamo-020.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Prepare canonical DesarrollAMO candidate key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/amoedo7/StoreAMO/3f5009e0226c948469f0277f4571d5413b7133ba/ci/storeamo-debug.keystore.b64' \
            | base64 -d > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Unit tests and build
        working-directory: factoryamo-builds/FAMO-20260822-201753-13807/ClimaAMO
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Package checks
        shell: bash
        run: |
          set -euo pipefail
          APK='factoryamo-builds/FAMO-20260822-201753-13807/ClimaAMO/app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          test -s "$APK"
          unzip -tqq "$APK"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.desarrollamo.climaamo' versionCode='3' versionName='0.2.1'"
          PERMS="$($AAPT dump permissions "$APK")"
          echo "$PERMS" | grep -q 'android.permission.INTERNET'
          echo "$PERMS" | grep -q 'android.permission.ACCESS_COARSE_LOCATION'
          echo "$PERMS" | grep -q 'android.permission.ACCESS_FINE_LOCATION'
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          CERT="$($APKSIGNER verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f')"
          test -n "$CERT"
          echo "SIGNER_SHA256=$CERT"
      - name: Live weather source contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse, urllib.request
          lat, lon = 55.6761, 12.5683
          ua = 'ClimaAMO/0.2.1 https://desarrollamo.com.ar'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'application/json'})
              return json.load(urllib.request.urlopen(req,timeout=20))
          om=get('https://api.open-meteo.com/v1/forecast?'+urllib.parse.urlencode({
              'latitude':lat,'longitude':lon,
              'current':'temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m',
              'hourly':'temperature_2m,relative_humidity_2m,precipitation_probability,visibility,pressure_msl,wind_speed_10m',
              'daily':'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,uv_index_max',
              'timezone':'auto','forecast_days':5}))
          assert len(om['daily']['time']) == 5
          met=get('https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=55.6761&lon=12.5683')
          assert met['properties']['timeseries']
          aq=get('https://air-quality-api.open-meteo.com/v1/air-quality?'+urllib.parse.urlencode({
              'latitude':lat,'longitude':lon,'current':'european_aqi,us_aqi,pm10,pm2_5,ozone','timezone':'auto'}))
          assert 'current' in aq
          print('REAL_SOURCES_OK Open-Meteo MET-Norway Air-Quality')
          PY
