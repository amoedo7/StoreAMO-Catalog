name: test-climaamo-020

on:
  pull_request:
    branches: [main]
    paths:
      - 'factoryamo-builds/FAMO-20260822-201753-13807/ClimaAMO/**'
      - 'climaamo-ci/**'
      - '.github/workflows/test-climaamo-020.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and build
        working-directory: factoryamo-builds/FAMO-20260822-201753-13807/ClimaAMO
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Package checks
        shell: bash
        run: |
          set -euo pipefail
          APK='factoryamo-builds/FAMO-20260822-201753-13807/ClimaAMO/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -tqq "$APK"
          aapt dump badging "$APK" | grep -q "package: name='com.desarrollamo.climaamo' versionCode='2' versionName='0.2.0'"
          apksigner verify --verbose "$APK"
