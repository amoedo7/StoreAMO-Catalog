name: factoryamo-batch40-famo-20260822-201753-13807

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: factoryamo-batch40-famo-20260822-201753-13807
  cancel-in-progress: false

jobs:
  build-publish:
    if: github.event_name != 'issues' || github.event.issue.title == 'FACTORYAMO_BATCH40_FAMO_20260822_201753_13807'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JOB_ID: FAMO-20260822-201753-13807
      BATCH: factoryamo-builds/FAMO-20260822-201753-13807/Batch40
      STATUS: factoryamo-relay/llegada/FAMO-20260822-201753-13807/status.json
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decode and generate 40 real Android apps
        shell: bash
        run: |
          set -euo pipefail
          base64 -d "$BATCH/generator.py.gz.b64" | gzip -d > "$BATCH/generate.py"
          python3 -m py_compile "$BATCH/generate.py"
          python3 "$BATCH/generate.py" generate
          node "$BATCH/tests/selftest.cjs"

      - name: Checkpoint source and enter BUILDING
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['STATUS']); d=json.loads(p.read_text())
          d.update(stage='BUILDING', current_state='BUILDING', current_index=1, current_app='MonedAMO',
                   last_completed_action='Generadas 40 apps Android distintas y superados 40/40 self-tests deterministas.',
                   next_action='Compilar los 40 product flavors Android y verificar cada APK.')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'FactoryAMO Batch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$BATCH" "$STATUS"
          git commit -m 'factoryamo(batch40): generate 40 Android candidates and pass self-tests'
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Build all 40 APKs
        working-directory: factoryamo-builds/FAMO-20260822-201753-13807/Batch40
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify identity integrity signature permissions and package 40 APKs
        shell: bash
        run: |
          set -euo pipefail
          python3 "$BATCH/generate.py" package
          test "$(find public-artifacts -type f -path '*/0.1.0/*.apk' | grep -E '/(monedamo|edadamo|dividamo|propinamo|combustamo|viajeamo|cuotamo|interesamo|reglatresamo|promediamo|fraccionamo|primoamo|mcdamo|baseamo|romanamo|coloramo|textoamo|mayusamo|limpiamo|repetamo|uuidamo|base64amo|urlamo|jsonamo|regexamo|listaamo|morseamo|cesaramo|marcadoramo|pomodoramo|respiramo|intervalamo|diasamo|faltanamo|unixamo|zonaamo|figuraamo|velocamo|bytesamo|slugamo)/' | wc -l)" = '40'

      - name: Rebuild StoreAMO catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 build_catalog.py

      - name: Publish exact candidate APKs and registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['STATUS']); d=json.loads(p.read_text())
          d.update(stage='VERIFYING', current_state='VERIFYING', current_index=40, current_app='SlugAMO',
                   last_completed_action='Compilados y validados 40 APK: integridad, package/version, firma y cero permisos Android.',
                   next_action='Publicar artefactos y verificar por HTTPS cada descarga contra su SHA-256.')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git add "$BATCH" registry verification-reports catalog.json "$STATUS"
          git add -f public-artifacts
          git commit -m 'artifact(factoryamo): publish Batch40 candidate APKs to StoreAMO'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify every public StoreAMO download and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          meta=json.loads((Path(os.environ['BATCH'])/'build-meta.json').read_text())
          pending={a['id']:a for a in meta['apps']}
          last={}
          for round_no in range(1,13):
              for slug,a in list(pending.items()):
                  try:
                      req=urllib.request.Request(a['url'],headers={'User-Agent':'FactoryAMO-Batch40'})
                      with urllib.request.urlopen(req,timeout=20) as r:
                          body=r.read(); code=r.status; ctype=r.headers.get('Content-Type','')
                      got=hashlib.sha256(body).hexdigest()
                      if code==200 and len(body)==a['size_bytes'] and got==a['sha256'] and not body.lstrip().startswith(b'<'):
                          print(f'PASS {slug} HTTP={code} bytes={len(body)} sha256={got}')
                          del pending[slug]
                      else:
                          last[slug]=f'HTTP={code} bytes={len(body)} type={ctype} sha={got}'
                  except Exception as e:
                      last[slug]=repr(e)
              if not pending: break
              print(f'round {round_no}: waiting for {len(pending)} raw GitHub artifacts to propagate')
              time.sleep(5)
          if pending:
              for slug in pending: print('FAIL',slug,last.get(slug,'unknown'))
              raise SystemExit(f'{len(pending)} public downloads did not verify')
          if len(meta['apps']) != 40: raise SystemExit('build-meta does not contain 40 apps')
          print('40/40 public StoreAMO APK downloads verified')
          PY

      - name: Finalize verification reports and Llegada
        shell: bash
        run: |
          set -euo pipefail
          python3 "$BATCH/generate.py" mark-public
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path(os.environ['STATUS']); d=json.loads(p.read_text())
          d.update(stage='PUBLISHED', current_state='PUBLISHED', current_index=40, current_app='SlugAMO',
                   completed=40, blocked=0,
                   message='FactoryAMO Batch40 completado: 40/40 APK Android candidate publicados en StoreAMO con tests, build, integridad, identidad, firma, cero permisos y descarga pública SHA-256 verificados. Device-smoke queda para la instalación real desde StoreAMO.',
                   last_completed_action='Verificadas 40/40 descargas públicas exactas por HTTPS y SHA-256.',
                   next_action='Instalar los candidates desde StoreAMO; cada instalación física aporta el device-smoke para promoción futura a Verified.',
                   updated_at=datetime.now(timezone.utc).isoformat(),
                   storeamo_url='https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/catalog.json')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git add verification-reports "$STATUS"
          git commit -m 'verify(factoryamo): confirm 40 Batch40 public APK downloads'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Close trigger issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment 'FactoryAMO Batch40 completed: 40/40 candidate APKs published and public-download SHA-256 verified.'

      - name: Persist failure checkpoint
        if: failure()
        shell: bash
        run: |
          set +e
          git pull --rebase origin main
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path(os.environ['STATUS'])
          try: d=json.loads(p.read_text())
          except Exception: d={'schema':'factoryamo.relay.v1','job_id':os.environ['JOB_ID']}
          d.update(stage='BLOCKED', current_state='BLOCKED',
                   message='Batch40 encontró un fallo técnico en GitHub Actions. El checkpoint conserva el trabajo; revisar el run y reanudar desde la etapa fallida.',
                   last_error=f"GitHub Actions run {os.environ.get('GITHUB_RUN_ID','unknown')} failed",
                   next_action=f"Diagnosticar y reparar https://github.com/amoedo7/StoreAMO-Catalog/actions/runs/{os.environ.get('GITHUB_RUN_ID','')}",
                   updated_at=datetime.now(timezone.utc).isoformat())
          p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git add "$STATUS"
          git commit -m 'checkpoint(factoryamo): Batch40 failure state' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
