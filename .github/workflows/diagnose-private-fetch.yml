name: diagnose-private-fetch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-private-fetch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test private source access without exposing credentials
        env:
          GH_TOKEN: ${{ secrets.STOREAMO_NEWS_TOKEN }}
        shell: bash
        run: |
          set -u
          mkdir -p verification
          out=verification/private-fetch-status.txt
          : > "$out"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'TOKEN=MISSING' >> "$out"
          else
            echo 'TOKEN=PRESENT' >> "$out"
            for item in \
              'amoedo7/CalculAMO|dist/CalculAMO-0.1.0.apk' \
              'amoedo7/CronAMO|dist/CronAMO-0.1.0.apk' \
              'amoedo7/BrujulAMO|dist/BrujulAMO-0.1.0.apk'; do
              repo="${item%%|*}"; path="${item#*|}"
              if gh api "repos/${repo}/contents/${path}?ref=main" --silent >/dev/null 2>&1; then
                echo "$repo=OK" >> "$out"
              else
                echo "$repo=FAIL" >> "$out"
              fi
            done
          fi
          cat "$out"
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name 'StoreAMO Diagnostic Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add verification/private-fetch-status.txt
          git commit -m 'ci: record private source fetch diagnostic'
          git push
