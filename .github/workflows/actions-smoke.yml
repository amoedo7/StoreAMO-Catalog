name: actions-smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/actions-smoke.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Prove Actions can write
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          printf 'StoreAMO Actions smoke OK %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > verification/actions-smoke.txt
          git config user.name 'StoreAMO Smoke Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add verification/actions-smoke.txt
          git commit -m 'ci: prove StoreAMO Actions write path'
          git push
