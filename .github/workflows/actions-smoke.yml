name: actions-smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/actions-smoke.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prove Actions can write
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          printf 'StoreAMO Actions smoke OK 2026-08-22T14:31Z\n' > verification/actions-smoke.txt
          git config user.name 'StoreAMO Smoke Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add verification/actions-smoke.txt
          git commit -m 'ci: prove StoreAMO Actions write path'
          git push
