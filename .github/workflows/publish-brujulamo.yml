name: publish-brujulamo
on:
  push:
    branches: [main]
    paths: [registry/brujulamo.json, .github/workflows/publish-brujulamo.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact private CI artifact
        env:
          PRIVATE_TOKEN: ${{ secrets.STOREAMO_NEWS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_TOKEN"
          curl -fL -H "Authorization: Bearer $PRIVATE_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/amoedo7/BrujulAMO/actions/artifacts/9410963366/zip -o /tmp/brujulamo.zip
          mkdir -p /tmp/brujulamo && unzip -q /tmp/brujulamo.zip -d /tmp/brujulamo
          APK=/tmp/brujulamo/BrujulAMO-0.1.0.apk
          test -s "$APK"
          echo '430aa12769a2d7337062e8835cd0fa08fbd4bcf774d6fc9475467431f13441dd  /tmp/brujulamo/BrujulAMO-0.1.0.apk' | sha256sum -c -
          unzip -tqq "$APK"
      - name: Publish public distribution release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=/tmp/brujulamo/BrujulAMO-0.1.0.apk
          gh release view brujulamo-v0.1.0 >/dev/null 2>&1 || gh release create brujulamo-v0.1.0 --target main --title 'BrujulAMO v0.1.0' --notes 'Candidate de distribución StoreAMO.'
          gh release upload brujulamo-v0.1.0 "$APK#BrujulAMO-0.1.0.apk" --clobber
      - name: Verify public download
        run: |
          set -euo pipefail
          curl -fL --retry 5 'https://github.com/amoedo7/StoreAMO-Catalog/releases/download/brujulamo-v0.1.0/BrujulAMO-0.1.0.apk' -o /tmp/public.apk
          echo '430aa12769a2d7337062e8835cd0fa08fbd4bcf774d6fc9475467431f13441dd  /tmp/public.apk' | sha256sum -c -
          unzip -tqq /tmp/public.apk
