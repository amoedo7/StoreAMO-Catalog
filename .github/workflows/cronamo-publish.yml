name: publish-cronamo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cronamo-publish.yml'
      - 'registry/cronamo.json'
      - '.release-input/cronamo-0.1.0.part*'

permissions:
  contents: write

concurrency:
  group: publish-cronamo-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cat .release-input/cronamo-0.1.0.part* | base64 -d > /tmp/CronAMO-0.1.0.apk
          test "$(stat -c%s /tmp/CronAMO-0.1.0.apk)" = "11181"
          echo "9dd9dcb91e394ebcb5135297b2eb7bd03e9e591f84428e028394e00a29cb2253  /tmp/CronAMO-0.1.0.apk" | sha256sum -c -

      - name: Publish public distribution release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='cronamo-v0.1.0'
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "CronAMO v0.1.0" --notes "Candidate de distribución StoreAMO. Source privado; APK público verificado por SHA-256."
          gh release upload "$TAG" /tmp/CronAMO-0.1.0.apk#CronAMO-0.1.0.apk --clobber

      - name: Verify public download
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 'https://github.com/amoedo7/StoreAMO-Catalog/releases/download/cronamo-v0.1.0/CronAMO-0.1.0.apk' -o /tmp/public.apk
          echo "9dd9dcb91e394ebcb5135297b2eb7bd03e9e591f84428e028394e00a29cb2253  /tmp/public.apk" | sha256sum -c -
          unzip -tqq /tmp/public.apk

      - name: Validate registry contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          m=json.load(open('registry/cronamo.json')); a=m['artifacts'][0]
          assert m['status']=='candidate' and a['sha256']=='9dd9dcb91e394ebcb5135297b2eb7bd03e9e591f84428e028394e00a29cb2253'
          print('CRONAMO_PUBLIC_OK')
          PY
