name: factoryamo-batch40-pr-v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  build40:
    if: github.event.pull_request.title == 'FACTORYAMO BATCH40 BUILD FAMO-20260822-201753-13807'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JOB_ID: FAMO-20260822-201753-13807
      BATCH: factoryamo-builds/FAMO-20260822-201753-13807/Batch40
      STATUS: factoryamo-relay/llegada/FAMO-20260822-201753-13807/status.json
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reassemble generator and run 40 self-tests
        shell: bash
        run: |
          set -euo pipefail
          echo '1590d8b8cb02a69e32e31713291c1461eed47008da42ed0227b614b97fa8e270  '"$BATCH/generator.part00" | sha256sum -c -
          echo 'd30eed4239fe8854c70afa003be7ddf5c10bd7d9ff80290c5ac0a46c9fcf0f41  '"$BATCH/generator.part01" | sha256sum -c -
          echo 'a3b094d9966d2fe36a804713b02d7963de469acc9bfd7a187984c0dd179de6ab  '"$BATCH/generator.part02" | sha256sum -c -
          echo '8da5e7cb5c0f68065485e609fd7d63491d5d8cf9f71ac9441464770e9663ca06  '"$BATCH/generator.part03" | sha256sum -c -
          cat "$BATCH"/generator.part0* | base64 -d | gzip -d > "$BATCH/generate.py"
          python3 - <<'PY'
          from pathlib import Path

          p=Path('factoryamo-builds/FAMO-20260822-201753-13807/Batch40/generate.py')
          lines=p.read_text().splitlines()

          # Make the signer check independent from the generator's run() helper.
          if not any(l.strip() == 'import subprocess' for l in lines):
              insert_at=0
              while insert_at < len(lines) and (lines[insert_at].startswith('#!') or lines[insert_at].strip()=='' or lines[insert_at].startswith('from __future__')):
                  insert_at += 1
              lines.insert(insert_at,'import subprocess')

          sig_i=next((i for i,l in enumerate(lines) if 'sig=run([apksigner' in l and '--print-certs' in l), None)
          if sig_i is None:
              sig_i=next((i for i,l in enumerate(lines) if 'sig = run([apksigner' in l and '--print-certs' in l), None)
          if sig_i is None:
              raise SystemExit('apksigner invocation not found')
          indent=lines[sig_i][:len(lines[sig_i])-len(lines[sig_i].lstrip())]
          lines[sig_i:sig_i+1]=[
              indent+'sig_p=subprocess.run([apksigner,"verify","--print-certs",str(apk)],capture_output=True,text=True,check=True)',
              indent+'sig=(sig_p.stdout or "")+"\\n"+(sig_p.stderr or "")',
          ]

          cert_i=next((i for i,l in enumerate(lines) if 'Signer #1 certificate SHA-256 digest:' in l and 're.search' in l), None)
          if cert_i is None:
              raise SystemExit('signer digest parser not found')
          if cert_i+3 >= len(lines) or 'signer digest unavailable' not in lines[cert_i+2] or 'm.group' not in lines[cert_i+3]:
              raise SystemExit('unexpected signer digest parser layout')
          indent=lines[cert_i][:len(lines[cert_i])-len(lines[cert_i].lstrip())]
          lines[cert_i:cert_i+4]=[
              indent+'cert=""',
              indent+'for _line in sig.splitlines():',
              indent+'    if "certificate SHA-256 digest:" in _line:',
              indent+'        cert=_line.rsplit(":",1)[1].strip().lower()',
              indent+'        break',
              indent+'if not re.fullmatch(r"[0-9a-f]{64}",cert):',
              indent+'    raise RuntimeError(f"{slug}: signer digest unavailable; apksigner={sig!r}")',
          ]

          p.write_text('\n'.join(lines)+'\n')
          PY
          python3 -m py_compile "$BATCH/generate.py"
          python3 "$BATCH/generate.py" generate
          node "$BATCH/tests/selftest.cjs"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Compile all 40 Android variants
        working-directory: factoryamo-builds/FAMO-20260822-201753-13807/Batch40
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify and package all 40 candidates
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          python3 -u "$BATCH/generate.py" package
          python3 build_catalog.py
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['STATUS']); d=json.loads(p.read_text())
          d.update(stage='PUBLISHING', current_state='PUBLISHING', current_index=40, current_app='SlugAMO',
                   last_completed_action='40/40 self-tests superados; 40 APK compilados; identidad, versión, integridad, firma y cero permisos validados.',
                   next_action='Fusionar el PR de artefactos a main y verificar las 40 descargas públicas por HTTPS y SHA-256.')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Commit all evidence to PR branch
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(python3 - <<'PY'
          import json
          print(len(json.load(open('factoryamo-builds/FAMO-20260822-201753-13807/Batch40/build-meta.json'))['apps']))
          PY
          )" = '40'
          git config user.name 'FactoryAMO Batch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$BATCH" registry verification-reports catalog.json "$STATUS"
          git add -f public-artifacts
          if git diff --cached --quiet; then
            echo 'No artifact changes; Batch40 evidence already staged in branch.'
          else
            git commit -m 'artifact(factoryamo): build and stage 40 StoreAMO Android candidates'
            git push origin HEAD:"$HEAD_REF"
          fi
