name: fix-storeamo-three-downloads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-storeamo-three-downloads.yml'

permissions:
  contents: write

concurrency:
  group: fix-storeamo-three-downloads
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: sdkmanager "build-tools;35.0.0" >/dev/null

      - name: Reconstruct exact APKs without private-repo credentials
        id: reconstruct
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/storeamo-fix verification
          : > verification/three-download-repair-status.txt

          rebuild() {
            local id="$1" name="$2" expected="$3"
            cat ".repair-input/${id}/"part*.b64 | tr -d '\r\n\t ' | base64 -d > "/tmp/storeamo-fix/${name}-0.1.0.apk"
            local actual
            actual="$(sha256sum "/tmp/storeamo-fix/${name}-0.1.0.apk" | awk '{print $1}')"
            echo "${id}: reconstructed_sha=${actual}" | tee -a verification/three-download-repair-status.txt
            test "$actual" = "$expected"
            unzip -tqq "/tmp/storeamo-fix/${name}-0.1.0.apk"
          }

          rebuild calculamo CalculAMO be42c2fa78be738ed03c367970119fe82cbb2c323532e674455bb63007617b2b
          rebuild cronamo CronAMO c9763fcf0cd3f144445948fd72870cbede8eea9b828ab167b927e7885683ba51
          rebuild brujulamo BrujulAMO 6d77cf2cc3fdff8bc0ea05a79a97725830cc07d2d088f83ed15bebe91babb3a8
          echo 'RECONSTRUCT_OK=3/3' | tee -a verification/three-download-repair-status.txt

      - name: Verify APK identity and signature
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          verify_one() {
            local id="$1" name="$2" package="$3"
            local apk="/tmp/storeamo-fix/${name}-0.1.0.apk"
            "$BT/aapt" dump badging "$apk" > "/tmp/storeamo-fix/${id}.badging"
            grep -q "package: name='${package}' versionCode='1' versionName='0.1.0'" "/tmp/storeamo-fix/${id}.badging"
            "$BT/apksigner" verify --verbose --print-certs "$apk" > "/tmp/storeamo-fix/${id}.signature"
            sha256sum "$apk" | awk '{print $1}' > "/tmp/storeamo-fix/${id}.sha256"
            stat -c%s "$apk" > "/tmp/storeamo-fix/${id}.size"
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "/tmp/storeamo-fix/${id}.signature" | head -n1 | tr '[:upper:]' '[:lower:]' > "/tmp/storeamo-fix/${id}.cert"
            test -s "/tmp/storeamo-fix/${id}.cert"
            echo "${id}: identity_signature_ok size=$(cat /tmp/storeamo-fix/${id}.size) cert=$(cat /tmp/storeamo-fix/${id}.cert)" | tee -a verification/three-download-repair-status.txt
          }
          verify_one calculamo CalculAMO com.desarrollamo.calculamo
          verify_one cronamo CronAMO com.desarrollamo.cronamo
          verify_one brujulamo BrujulAMO com.desarrollamo.brujulamo
          echo 'APK_VERIFY_OK=3/3' | tee -a verification/three-download-repair-status.txt

      - name: Publish APKs as direct raw GitHub files
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-artifacts/calculamo/0.1.0 public-artifacts/cronamo/0.1.0 public-artifacts/brujulamo/0.1.0
          cp /tmp/storeamo-fix/CalculAMO-0.1.0.apk public-artifacts/calculamo/0.1.0/CalculAMO-0.1.0.apk
          cp /tmp/storeamo-fix/CronAMO-0.1.0.apk public-artifacts/cronamo/0.1.0/CronAMO-0.1.0.apk
          cp /tmp/storeamo-fix/BrujulAMO-0.1.0.apk public-artifacts/brujulamo/0.1.0/BrujulAMO-0.1.0.apk
          git config user.name 'StoreAMO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f public-artifacts/calculamo/0.1.0/CalculAMO-0.1.0.apk public-artifacts/cronamo/0.1.0/CronAMO-0.1.0.apk public-artifacts/brujulamo/0.1.0/BrujulAMO-0.1.0.apk
          if ! git diff --cached --quiet; then
            git commit -m 'artifact: publish direct APKs for CalculAMO CronAMO BrujulAMO'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo 'RAW_ARTIFACTS_PUBLISHED=3/3' | tee -a verification/three-download-repair-status.txt

      - name: Prove anonymous downloads before changing StoreAMO catalog
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local id="$1" name="$2"
            local url="https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/public-artifacts/${id}/0.1.0/${name}-0.1.0.apk"
            local expected="$(cat /tmp/storeamo-fix/${id}.sha256)"
            local ok=0
            for n in $(seq 1 12); do
              if curl -fL --connect-timeout 15 --max-time 60 --retry 2 --retry-all-errors "$url" -o "/tmp/storeamo-fix/${id}.public.apk"; then
                local actual="$(sha256sum "/tmp/storeamo-fix/${id}.public.apk" | awk '{print $1}')"
                if [ "$actual" = "$expected" ] && cmp -s "/tmp/storeamo-fix/${name}-0.1.0.apk" "/tmp/storeamo-fix/${id}.public.apk"; then
                  unzip -tqq "/tmp/storeamo-fix/${id}.public.apk"
                  ok=1
                  break
                fi
              fi
              sleep 5
            done
            test "$ok" = 1
            echo "${id}: PUBLIC_DOWNLOAD_OK ${url}" | tee -a verification/three-download-repair-status.txt
          }
          probe calculamo CalculAMO
          probe cronamo CronAMO
          probe brujulamo BrujulAMO
          echo 'ANONYMOUS_DOWNLOAD_OK=3/3' | tee -a verification/three-download-repair-status.txt

      - name: Point registry and catalog at the proven files
        id: catalog
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          import json
          from pathlib import Path

          apps = {
              'calculamo': ('CalculAMO', 'com.desarrollamo.calculamo'),
              'cronamo': ('CronAMO', 'com.desarrollamo.cronamo'),
              'brujulamo': ('BrujulAMO', 'com.desarrollamo.brujulamo'),
          }
          for app_id, (name, package) in apps.items():
              p = Path('registry') / f'{app_id}.json'
              data = json.loads(p.read_text())
              artifact = next(a for a in data['artifacts'] if a['platform'] == 'android')
              sha = Path(f'/tmp/storeamo-fix/{app_id}.sha256').read_text().strip()
              size = int(Path(f'/tmp/storeamo-fix/{app_id}.size').read_text().strip())
              cert = Path(f'/tmp/storeamo-fix/{app_id}.cert').read_text().strip()
              url = f'https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/public-artifacts/{app_id}/0.1.0/{name}-0.1.0.apk'
              artifact.update({
                  'url': url,
                  'sha256': sha,
                  'size_bytes': size,
                  'application_id': package,
                  'signing_cert_sha256': cert,
                  'verified': False,
                  'verification_report': None,
                  'source': 'distribution-registry',
              })
              data.setdefault('store', {})['notes'] = (
                  f'{name} 0.1.0 candidate. Descarga directa raw GitHub probada anónimamente por CI; '
                  'APK validado por SHA-256, package y firma. No se declara StoreAMO Verified.'
              )
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

          python build_catalog.py --owner amoedo7
          python enrich_catalog.py

          python - <<'PY'
          import json
          from pathlib import Path
          names = {'calculamo':'CalculAMO','cronamo':'CronAMO','brujulamo':'BrujulAMO'}
          packages = {
              'calculamo':'com.desarrollamo.calculamo',
              'cronamo':'com.desarrollamo.cronamo',
              'brujulamo':'com.desarrollamo.brujulamo',
          }
          c=json.loads(Path('catalog.json').read_text())
          for app_id,name in names.items():
              app=next(x for x in c['apps'] if x['id']==app_id)
              a=next(x for x in app['artifacts'] if x['platform']=='android')
              expected_url=f'https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/public-artifacts/{app_id}/0.1.0/{name}-0.1.0.apk'
              expected_sha=Path(f'/tmp/storeamo-fix/{app_id}.sha256').read_text().strip()
              expected_size=int(Path(f'/tmp/storeamo-fix/{app_id}.size').read_text().strip())
              assert app['status']=='candidate'
              assert a['url']==expected_url
              assert a['sha256']==expected_sha
              assert a['size_bytes']==expected_size
              assert a['application_id']==packages[app_id]
              out={
                  'schema':'storeamo.distribution-check.v1',
                  'app_id':app_id,
                  'version':'0.1.0',
                  'url':expected_url,
                  'size_bytes':expected_size,
                  'sha256':expected_sha,
                  'application_id':packages[app_id],
                  'result':'public-download-ok'
              }
              Path('verification').mkdir(exist_ok=True)
              Path(f'verification/{app_id}-v0.1.0.json').write_text(json.dumps(out, ensure_ascii=False, indent=2)+'\n')
          PY

          echo 'CATALOG_DIRECT_OK=3/3' | tee -a verification/three-download-repair-status.txt
          echo 'STOREAMO_DOWNLOAD_REPAIR=PASS' | tee -a verification/three-download-repair-status.txt

          git config user.name 'StoreAMO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add registry/calculamo.json registry/cronamo.json registry/brujulamo.json catalog.json discovery-report.json verification/calculamo-v0.1.0.json verification/cronamo-v0.1.0.json verification/brujulamo-v0.1.0.json verification/three-download-repair-status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'fix: make CalculAMO CronAMO BrujulAMO directly downloadable'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Record failed repair diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          mkdir -p verification
          echo 'STOREAMO_DOWNLOAD_REPAIR=FAIL' >> verification/three-download-repair-status.txt
          echo "reconstruct=${{ steps.reconstruct.outcome }} verify=${{ steps.verify.outcome }} publish=${{ steps.publish.outcome }} probe=${{ steps.probe.outcome }} catalog=${{ steps.catalog.outcome }}" >> verification/three-download-repair-status.txt
          git config user.name 'StoreAMO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add verification/three-download-repair-status.txt
          git commit -m 'diagnostic: StoreAMO three-download repair failed' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
