name: stage-factoryamo-011

on:
  push:
    branches: [main]
    paths:
      - '.release-input/factoryamo-0.1.1.part*'
      - '.github/workflows/stage-factoryamo-011.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-factoryamo-011
  cancel-in-progress: false

jobs:
  publish-exact-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reassemble and verify exact APK
        shell: bash
        run: |
          set -euo pipefail
          P='.release-input/factoryamo-0.1.1'
          for n in 00 01 02 03; do test -f "${P}.part${n}"; done
          PREFIX=''
          SUFFIX=''
          {
            cat "${P}.part00" "${P}.part01" "${P}.part02" "${P}.part03"
            printf '%s' "$PREFIX"
            printf 'A%.0s' {1..3440}
            printf '%s' "$SUFFIX"
          } > /tmp/factoryamo.b64
          test "$(stat -c%s /tmp/factoryamo.b64)" = '31208'
          base64 -d /tmp/factoryamo.b64 > /tmp/FactoryAMO-0.1.1.apk
          test "$(stat -c%s /tmp/FactoryAMO-0.1.1.apk)" = '23405'
          test "$(sha256sum /tmp/FactoryAMO-0.1.1.apk | awk '{print $1}')" = 'a5a576c51bd388b5c2577f8ed2b5fccd153ada81c2b9d1f45e365c50d49b9af8'
          unzip -tqq /tmp/FactoryAMO-0.1.1.apk
      - name: Publish verified APK bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'StoreAMO Artifact Bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          mkdir -p public-artifacts/factoryamo/0.1.1
          cp /tmp/FactoryAMO-0.1.1.apk public-artifacts/factoryamo/0.1.1/FactoryAMO-0.1.1.apk
          git add -f public-artifacts/factoryamo/0.1.1/FactoryAMO-0.1.1.apk
          rm -f .release-input/factoryamo-0.1.1.part00 \
                .release-input/factoryamo-0.1.1.part01 \
                .release-input/factoryamo-0.1.1.part02 \
                .release-input/factoryamo-0.1.1.part03 \
                .release-input/factoryamo-0.1.1.part04 \
                .release-input/factoryamo-0.1.1.part99 \
                .release-input/factoryamo-0.1.1.parttrigger
          git add -A .release-input public-artifacts/factoryamo/0.1.1
          git commit -m 'artifact(factoryamo): publish exact 0.1.1 relay candidate APK'
          git pull --rebase origin main
          git push origin HEAD:main
