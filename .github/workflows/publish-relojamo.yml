name: publish-relojamo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - relojamo-publish.trigger

permissions:
  contents: write

concurrency:
  group: publish-relojamo-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Reconstruct and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cat .release-input/relojamo-0.1.0.part00 .release-input/relojamo-0.1.0.part01 | base64 -d > /tmp/RelojAMO-0.1.0.apk
          test "$(stat -c%s /tmp/RelojAMO-0.1.0.apk)" = "10537"
          echo "0fd0bef2ddb62a99656727fef55d99b0d468353f4854b27dd0dbb8b8c5eb12c0  /tmp/RelojAMO-0.1.0.apk" | sha256sum -c -

      - name: Publish public distribution release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='relojamo-v0.1.0'
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "RelojAMO v0.1.0" --notes "Candidate de distribución StoreAMO. Source privado; APK público verificado por SHA-256."
          gh release upload "$TAG" /tmp/RelojAMO-0.1.0.apk#RelojAMO-0.1.0.apk --clobber

      - name: Validate registry contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          m=json.loads(pathlib.Path('registry/relojamo.json').read_text())
          assert m['status']=='candidate'
          assert m['source']['visibility']=='private'
          assert m['distribution']['mode']=='direct-artifacts'
          a=m['artifacts'][0]
          assert a['version']=='0.1.0'
          assert a['version_code']=='1'
          assert a['application_id']=='com.desarrollamo.relojamo'
          assert a['sha256']=='0fd0bef2ddb62a99656727fef55d99b0d468353f4854b27dd0dbb8b8c5eb12c0'
          assert a['size_bytes']==10537
          assert a['url'].startswith('https://github.com/amoedo7/StoreAMO-Catalog/releases/download/')
          print('RELOJAMO_REGISTRY_OK')
          PY
