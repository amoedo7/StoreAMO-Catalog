name: finalize-notasamo

on:
  push:
    branches:
      - fix/notasamo-public-distribution
    paths:
      - '.github/workflows/publish-notasamo.yml'

permissions:
  contents: write

concurrency:
  group: finalize-notasamo-v0.1.0
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      PUBLIC_URL: 'https://github.com/amoedo7/StoreAMO-Catalog/releases/download/notasamo-v0.1.0/NotasAMO-0.1.0.apk'
      EXPECTED_SHA256: '5c195e8c74f37b648a8245bb373fb0562112f93986e0d2afe36eceb3f03b381f'
      EXPECTED_SIZE: '5581509'
    steps:
      - uses: actions/checkout@v4

      - name: Verify anonymous public download
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors "$PUBLIC_URL" -o /tmp/notasamo-public.apk
          test "$(stat -c%s /tmp/notasamo-public.apk)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  /tmp/notasamo-public.apk" | sha256sum -c -
          unzip -tqq /tmp/notasamo-public.apk

      - name: Rebuild catalog and Buenas Nuevas
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python build_catalog.py --owner amoedo7
          python enrich_catalog.py
          python build_news.py
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          c=json.load(open('catalog.json'))
          a=next(x for x in c['apps'] if x['id']=='notasamo')
          x=next(x for x in a['artifacts'] if x['platform']=='android')
          assert a['status']=='candidate'
          assert a['source_visibility']=='private'
          assert x['version']=='0.1.0'
          assert x['version_code']=='1'
          assert x['application_id']=='com.desarrollamo.notasamo'
          assert x['url']==os.environ['PUBLIC_URL']
          assert x['sha256']==os.environ['EXPECTED_SHA256']
          assert x['size_bytes']==int(os.environ['EXPECTED_SIZE'])
          assert x['verified'] is False
          payload = {
            'schema': 'storeamo.public-artifact-verification.v1',
            'app_id': 'notasamo',
            'version': '0.1.0',
            'status': 'passed',
            'checked_at': datetime.now(timezone.utc).isoformat(),
            'url': os.environ['PUBLIC_URL'],
            'sha256': os.environ['EXPECTED_SHA256'],
            'size_bytes': int(os.environ['EXPECTED_SIZE']),
            'application_id': 'com.desarrollamo.notasamo',
            'checks': ['anonymous_https_download','sha256','size_bytes','apk_zip_integrity','catalog_candidate','catalog_application_id'],
            'catalog_includes_app': True,
            'verified': False
          }
          import pathlib
          pathlib.Path('verification').mkdir(exist_ok=True)
          pathlib.Path('verification/notasamo-v0.1.0.json').write_text(json.dumps(payload, indent=2, ensure_ascii=False)+'\n')
          print('NOTASAMO_STOREAMO_OK')
          PY

      - name: Persist finalized branch state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'StoreAMO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add catalog.json news.json discovery-report.json verification/notasamo-v0.1.0.json
          if ! git diff --cached --quiet; then
            git commit -m 'catalog: finalize NotasAMO 0.1.0 candidate'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
