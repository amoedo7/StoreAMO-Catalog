name: publish-gastamo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - gastamo-publish.trigger

permissions:
  contents: write

concurrency:
  group: publish-gastamo-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0" >/dev/null

      - name: Validate staged APK and calculate canonical metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          APK='.release-input/GastAMO-0.1.0.apk'
          test -s "$APK"
          unzip -tqq "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/gastamo-badging.txt
          grep -q "package: name='com.desarrollamo.gastamo' versionCode='1' versionName='0.1.0'" /tmp/gastamo-badging.txt
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "GastAMO staged APK: $SIZE bytes / $SHA"

      - name: Publish public distribution release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='gastamo-v0.1.0'
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target main --title "GastAMO v0.1.0" --notes "Candidate de distribución StoreAMO. Source privado; APK público validado y publicado desde StoreAMO-Catalog."
          gh release upload "$TAG" .release-input/GastAMO-0.1.0.apk#GastAMO-0.1.0.apk --clobber

      - name: Verify published bytes
        env:
          SHA_EXPECTED: ${{ steps.meta.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/amoedo7/StoreAMO-Catalog/releases/download/gastamo-v0.1.0/GastAMO-0.1.0.apk'
          curl -fsSL --retry 3 "$URL" -o /tmp/GastAMO-published.apk
          SHA="$(sha256sum /tmp/GastAMO-published.apk | awk '{print $1}')"
          test "$SHA" = "$SHA_EXPECTED"

      - name: Update registry from validated artifact
        env:
          SHA256: ${{ steps.meta.outputs.sha }}
          SIZE_BYTES: ${{ steps.meta.outputs.size }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('registry/gastamo.json')
          m=json.loads(p.read_text())
          assert m['status']=='candidate'
          assert m['source']['visibility']=='private'
          assert m['distribution']['mode']=='direct-artifacts'
          a=m['artifacts'][0]
          a.update({
            'version':'0.1.0',
            'version_code':'1',
            'application_id':'com.desarrollamo.gastamo',
            'url':'https://github.com/amoedo7/StoreAMO-Catalog/releases/download/gastamo-v0.1.0/GastAMO-0.1.0.apk',
            'release_url':'https://github.com/amoedo7/StoreAMO-Catalog/releases/tag/gastamo-v0.1.0',
            'sha256':os.environ['SHA256'],
            'size_bytes':int(os.environ['SIZE_BYTES']),
            'verified':False,
            'verification_report':None,
            'source':'distribution-registry'
          })
          p.write_text(json.dumps(m, ensure_ascii=False, indent=2)+'\n')
          PY

      - name: Rebuild StoreAMO catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python build_catalog.py --owner amoedo7
          python enrich_catalog.py
          python - <<'PY'
          import json
          c=json.load(open('catalog.json'))
          a=next(x for x in c['apps'] if x['id']=='gastamo')
          assert a['status']=='candidate' and len(a['artifacts'])==1
          assert a['artifacts'][0]['sha256']
          print('GASTAMO_CATALOG_OK')
          PY

      - name: Commit corrected publication metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- registry/gastamo.json catalog.json discovery-report.json; then
            echo 'GastAMO metadata already current'
            exit 0
          fi
          git config user.name 'StoreAMO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add registry/gastamo.json catalog.json discovery-report.json
          git commit -m 'catalog: repair GastAMO 0.1.0 artifact metadata'
          git pull --rebase origin main
          git push origin HEAD:main
