name: publish-gastamo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - gastamo-publish.trigger
      - .github/workflows/publish-gastamo.yml
      - registry/gastamo.json
      - verification-reports/gastamo-v0.1.0.json

permissions:
  contents: write

concurrency:
  group: publish-gastamo-v0.1.0
  cancel-in-progress: false

jobs:
  verify-direct-download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0" >/dev/null

      - name: Verify staged APK identity, signature and permissions
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          APK='.release-input/GastAMO-0.1.0.apk'
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          test -s "$APK"
          unzip -tqq "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/gastamo-badging.txt
          grep -q "package: name='com.desarrollamo.gastamo' versionCode='1' versionName='0.1.0'" /tmp/gastamo-badging.txt
          grep -q "launchable-activity: name='com.desarrollamo.gastamo.MainActivity'" /tmp/gastamo-badging.txt
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          test "$SHA" = '0272559619a62738d63c880ebe92ae0615d887cf6b9b3e9622b0b44278c15b2a'
          test "$SIZE" = '14949'
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/gastamo-apksigner.txt
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/gastamo-apksigner.txt | head -n1 | tr 'A-F' 'a-f')"
          test "$CERT" = 'ba0bfdc7d78a86a8d4d7969a92cf5808dd741ef19706694a52a9ba3761388c87'
          "$AAPT" dump permissions "$APK" | tee /tmp/gastamo-permissions.txt
          ! grep -q '^uses-permission:' /tmp/gastamo-permissions.txt
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"

      - name: Verify exact direct URL consumed by StoreAMO
        env:
          SHA_EXPECTED: ${{ steps.meta.outputs.sha }}
          SIZE_EXPECTED: ${{ steps.meta.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/.release-input/GastAMO-0.1.0.apk'
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 "$URL" -o /tmp/GastAMO-direct.apk
          test "$(stat -c%s /tmp/GastAMO-direct.apk)" = "$SIZE_EXPECTED"
          test "$(sha256sum /tmp/GastAMO-direct.apk | awk '{print $1}')" = "$SHA_EXPECTED"
          echo "GASTAMO_DIRECT_DOWNLOAD_PASS"

      - name: Keep GitHub Release as optional mirror
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG='gastamo-v0.1.0'
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target main --title "GastAMO v0.1.0" --notes "Candidate de distribución StoreAMO."
          gh release upload "$TAG" .release-input/GastAMO-0.1.0.apk#GastAMO-0.1.0.apk --clobber

      - name: Assert canonical registry and report
        shell: bash
        run: |
          python - <<'PY'
          import json
          m=json.load(open('registry/gastamo.json'))
          a=m['artifacts'][0]
          assert m['status']=='candidate'
          assert a['url']=='https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/.release-input/GastAMO-0.1.0.apk'
          assert a['sha256']=='0272559619a62738d63c880ebe92ae0615d887cf6b9b3e9622b0b44278c15b2a'
          assert a['size_bytes']==14949
          assert a['application_id']=='com.desarrollamo.gastamo'
          assert a['signing_cert_sha256']=='ba0bfdc7d78a86a8d4d7969a92cf5808dd741ef19706694a52a9ba3761388c87'
          assert a['verified'] is True
          r=json.load(open('verification-reports/gastamo-v0.1.0.json'))
          assert r['verified'] is True and all(x['status']=='PASS' for x in r['checks'].values())
          print('GASTAMO_VERIFICATION_CONTRACT_PASS')
          PY

      - name: Rebuild StoreAMO catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python build_catalog.py --owner amoedo7
          python enrich_catalog.py
          python - <<'PY'
          import json
          c=json.load(open('catalog.json'))
          app=next(x for x in c['apps'] if x['id']=='gastamo')
          a=app['artifacts'][0]
          assert app['status']=='candidate'
          assert a['verified'] is True
          assert a['url']=='https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/.release-input/GastAMO-0.1.0.apk'
          assert len(a['signing_cert_sha256'])==64
          print('GASTAMO_STORE_DOWNLOAD_READY')
          PY

      - name: Commit refreshed catalog
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- catalog.json discovery-report.json; then
            echo 'Catalog already current'
            exit 0
          fi
          git config user.name 'StoreAMO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add catalog.json discovery-report.json
          git commit -m 'catalog: verify GastAMO direct download'
          git pull --rebase origin main
          git push origin HEAD:main
