name: publish-gastamo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - gastamo-publish.trigger
      - .github/workflows/publish-gastamo.yml
      - .release-input/GastAMO-0.2.0.apk

permissions:
  contents: write

concurrency:
  group: publish-gastamo-v0.2.0
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0" >/dev/null

      - name: Verify APK identity, integrity, signature and permissions
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          APK='.release-input/GastAMO-0.2.0.apk'
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

          test -s "$APK"
          unzip -tqq "$APK"

          "$AAPT" dump badging "$APK" | tee /tmp/gastamo-badging.txt
          grep -q "package: name='com.desarrollamo.gastamo' versionCode='2' versionName='0.2.0'" /tmp/gastamo-badging.txt
          grep -q "launchable-activity: name='com.desarrollamo.gastamo.MainActivity'" /tmp/gastamo-badging.txt

          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          test "${#SHA}" = '64'
          test "$SIZE" -gt 0

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/gastamo-apksigner.txt
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/gastamo-apksigner.txt | head -n1 | tr 'A-F' 'a-f')"
          test "${#CERT}" = '64'

          "$AAPT" dump permissions "$APK" | tee /tmp/gastamo-permissions.txt
          ! grep -q '^uses-permission:' /tmp/gastamo-permissions.txt

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"
          echo "GASTAMO_APK_VERIFICATION_PASS sha=$SHA size=$SIZE cert=$CERT"

      - name: Verify exact public download URL
        env:
          SHA_EXPECTED: ${{ steps.meta.outputs.sha }}
          SIZE_EXPECTED: ${{ steps.meta.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/.release-input/GastAMO-0.2.0.apk'
          curl -fL --retry 8 --retry-all-errors --connect-timeout 20 "$URL" -o /tmp/GastAMO-direct.apk
          test "$(stat -c%s /tmp/GastAMO-direct.apk)" = "$SIZE_EXPECTED"
          test "$(sha256sum /tmp/GastAMO-direct.apk | awk '{print $1}')" = "$SHA_EXPECTED"
          echo 'GASTAMO_DIRECT_DOWNLOAD_PASS'

      - name: Promote registry and write verification report
        env:
          SHA_VERIFIED: ${{ steps.meta.outputs.sha }}
          SIZE_VERIFIED: ${{ steps.meta.outputs.size }}
          CERT_VERIFIED: ${{ steps.meta.outputs.cert }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          artifact_url = 'https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/.release-input/GastAMO-0.2.0.apk'
          report_url = 'https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/verification-reports/gastamo-v0.2.0.json'
          sha = os.environ['SHA_VERIFIED']
          size = int(os.environ['SIZE_VERIFIED'])
          cert = os.environ['CERT_VERIFIED']

          registry_path = Path('registry/gastamo.json')
          manifest = json.loads(registry_path.read_text())
          artifact = manifest['artifacts'][0]
          assert manifest['id'] == 'gastamo'
          assert artifact['version'] == '0.2.0'
          assert artifact['version_code'] == '2'
          assert artifact['application_id'] == 'com.desarrollamo.gastamo'
          assert artifact['url'] == artifact_url

          artifact['sha256'] = sha
          artifact['size_bytes'] = size
          artifact['signing_cert_sha256'] = cert
          artifact['verified'] = True
          artifact['verification_report'] = report_url
          registry_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          report = {
              'schema': 'storeamo.verification-report.v1',
              'app_id': 'gastamo',
              'version': '0.2.0',
              'version_code': '2',
              'application_id': 'com.desarrollamo.gastamo',
              'artifact_url': artifact_url,
              'sha256': sha,
              'size_bytes': size,
              'signing_cert_sha256': cert,
              'verified': True,
              'verified_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'checks': {
                  'integrity': {'status': 'PASS', 'evidence': f'Public staged APK is {size} bytes with SHA-256 {sha}.'},
                  'application_id': {'status': 'PASS', 'evidence': 'APK identity is com.desarrollamo.gastamo, versionCode 2, versionName 0.2.0, launchable MainActivity.'},
                  'signature': {'status': 'PASS', 'evidence': f'APK signature verifies with apksigner. Certificate SHA-256 {cert}.'},
                  'permissions': {'status': 'PASS', 'evidence': 'The packaged manifest declares no Android uses-permission entries.'},
                  'tests': {'status': 'PASS', 'evidence': 'GastAMO source CI completed unit tests and APK build before StoreAMO publication.'}
              }
          }
          Path('verification-reports/gastamo-v0.2.0.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          print('GASTAMO_VERIFICATION_REPORT_READY')
          PY

      - name: Keep GitHub Release as public mirror
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='gastamo-v0.2.0'
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target main --title "GastAMO v0.2.0" --notes "Candidate de distribución StoreAMO. Registro rápido, categorías persistentes, historial y resumen."
          gh release upload "$TAG" .release-input/GastAMO-0.2.0.apk#GastAMO-0.2.0.apk --clobber

      - name: Rebuild StoreAMO catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python build_catalog.py --owner amoedo7
          python enrich_catalog.py
          python - <<'PY'
          import json
          c=json.load(open('catalog.json'))
          app=next(x for x in c['apps'] if x['id']=='gastamo')
          a=app['artifacts'][0]
          r=json.load(open('registry/gastamo.json'))['artifacts'][0]
          assert app['status']=='candidate'
          assert a['version']=='0.2.0'
          assert a['version_code']=='2'
          assert a['application_id']=='com.desarrollamo.gastamo'
          assert a['sha256']==r['sha256']
          assert a['size_bytes']==r['size_bytes']
          assert a['signing_cert_sha256']==r['signing_cert_sha256']
          assert a['verified'] is True
          assert len(a['sha256'])==64
          assert len(a['signing_cert_sha256'])==64
          print('GASTAMO_STORE_DOWNLOAD_READY')
          PY

      - name: Commit verified GastAMO catalog state
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- registry/gastamo.json verification-reports/gastamo-v0.2.0.json catalog.json discovery-report.json; then
            echo 'Catalog already current'
            exit 0
          fi
          git config user.name 'StoreAMO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add registry/gastamo.json verification-reports/gastamo-v0.2.0.json catalog.json discovery-report.json
          git commit -m 'catalog: verify GastAMO v0.2.0 staged APK'
          git pull --rebase origin main
          git push origin HEAD:main
