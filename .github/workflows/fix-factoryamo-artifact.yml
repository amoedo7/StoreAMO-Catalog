name: fix-factoryamo-artifact

on:
  push:
    branches: [main]
    paths:
      - 'repair/factoryamo-parts/**'
      - '.github/workflows/fix-factoryamo-artifact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: android-actions/setup-android@v3
      - name: Reconstruct and verify exact FactoryAMO APK
        shell: bash
        run: |
          set -euo pipefail
          cat repair/factoryamo-parts/00.b64part repair/factoryamo-parts/01.b64part repair/factoryamo-parts/02.b64part repair/factoryamo-parts/03-prefix.b64part > /tmp/factoryamo.b64
          python - <<'PY' >> /tmp/factoryamo.b64
          print('A' * 3532, end='')
          PY
          cat repair/factoryamo-parts/03-suffix.b64part >> /tmp/factoryamo.b64
          test "$(wc -c < /tmp/factoryamo.b64)" = '19844'
          base64 -d /tmp/factoryamo.b64 > /tmp/FactoryAMO-0.1.0.apk
          test "$(stat -c%s /tmp/FactoryAMO-0.1.0.apk)" = '14881'
          test "$(sha256sum /tmp/FactoryAMO-0.1.0.apk | awk '{print $1}')" = '8ba047a9d2701eac9b7626c25eb3e533c0342eba380e37ed74abc72f602c8907'
          unzip -tqq /tmp/FactoryAMO-0.1.0.apk
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/aapt" dump badging /tmp/FactoryAMO-0.1.0.apk | tee /tmp/badging.txt
          grep -q "package: name='com.desarrollamo.factoryamo' versionCode='1' versionName='0.1.0'" /tmp/badging.txt
          "$BT/apksigner" verify --verbose --print-certs /tmp/FactoryAMO-0.1.0.apk | tee /tmp/signing.txt
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/signing.txt | head -n1 | tr 'A-F' 'a-f')"
          test "$CERT" = '473441518b7c10ca2c0d193a81499c012f9c7083dab628688c6198879b536561'
      - name: Replace corrupted public artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-artifacts/factoryamo/0.1.0 verification
          cp /tmp/FactoryAMO-0.1.0.apk public-artifacts/factoryamo/0.1.0/FactoryAMO-0.1.0.apk
          cat > verification/factoryamo-artifact-repair.json <<'JSON'
          {
            "schema": "storeamo.artifact-repair.v1",
            "app_id": "factoryamo",
            "version": "0.1.0",
            "application_id": "com.desarrollamo.factoryamo",
            "sha256": "8ba047a9d2701eac9b7626c25eb3e533c0342eba380e37ed74abc72f602c8907",
            "size_bytes": 14881,
            "signing_cert_sha256": "473441518b7c10ca2c0d193a81499c012f9c7083dab628688c6198879b536561",
            "reason": "initial binary transfer did not preserve the APK bytes",
            "status": "REPAIRED"
          }
          JSON
          git config user.name 'StoreAMO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f public-artifacts/factoryamo/0.1.0/FactoryAMO-0.1.0.apk verification/factoryamo-artifact-repair.json
          git rm -rf repair/factoryamo-parts repair/factoryamo-0.1.0.apk.b64 factoryamo-fix.trigger .github/workflows/fix-factoryamo-artifact.yml || true
          git commit -m 'fix(factoryamo): restore exact verified 0.1.0 APK bytes'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify exact public StoreAMO download
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/public-artifacts/factoryamo/0.1.0/FactoryAMO-0.1.0.apk'
          for n in $(seq 1 20); do
            if curl -fsSL --retry 2 --connect-timeout 15 --max-time 60 "$URL" -o /tmp/public.apk; then
              ACTUAL="$(sha256sum /tmp/public.apk | awk '{print $1}')"
              if [ "$ACTUAL" = '8ba047a9d2701eac9b7626c25eb3e533c0342eba380e37ed74abc72f602c8907' ] && [ "$(stat -c%s /tmp/public.apk)" = '14881' ]; then
                unzip -tqq /tmp/public.apk
                echo "FACTORYAMO_PUBLIC_DOWNLOAD_PASS $ACTUAL"
                exit 0
              fi
            fi
            sleep 3
          done
          echo 'FACTORYAMO_PUBLIC_DOWNLOAD_FAILED' >&2
          exit 1
