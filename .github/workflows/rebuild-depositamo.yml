name: rebuild-depositamo-from-scratch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rebuild-android/depositamo/**'
      - 'rebuild-android/settings.gradle'
      - '.github/workflows/rebuild-depositamo.yml'

permissions:
  contents: write

concurrency:
  group: storeamo-rebuild-depositamo
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Build DepositAMO from clean source
        shell: bash
        run: |
          set -euo pipefail
          cd rebuild-android
          gradle --no-daemon clean :depositamo:assembleDebug --stacktrace

      - name: Verify APK identity structure signature and permissions
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          SRC="rebuild-android/depositamo/build/outputs/apk/debug/depositamo-debug.apk"
          DST="public-artifacts/depositamo/0.1.0/DepositAMO-0.1.0.apk"
          mkdir -p /tmp/depositamo public-artifacts/depositamo/0.1.0
          test -s "$SRC"
          unzip -tqq "$SRC"
          "$BT/aapt" dump badging "$SRC" | tee /tmp/depositamo/badging.txt
          grep -q "package: name='com.desarrollamo.depositamo' versionCode='1' versionName='0.1.0'" /tmp/depositamo/badging.txt
          grep -q "launchable-activity:" /tmp/depositamo/badging.txt
          if "$BT/aapt" dump permissions "$SRC" | grep -q '^uses-permission:'; then
            echo 'Unexpected Android permission in DepositAMO rebuild' >&2
            "$BT/aapt" dump permissions "$SRC" >&2
            exit 1
          fi
          "$BT/apksigner" verify --verbose --print-certs "$SRC" | tee /tmp/depositamo/signature.txt
          cp "$SRC" "$DST"
          sha256sum "$DST" | awk '{print $1}' > /tmp/depositamo/sha256
          stat -c%s "$DST" > /tmp/depositamo/size
          sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/depositamo/signature.txt | head -n1 | tr '[:upper:]' '[:lower:]' > /tmp/depositamo/cert
          test -s /tmp/depositamo/cert
          echo "DEPOSITAMO_APK_OK $(cat /tmp/depositamo/size) $(cat /tmp/depositamo/sha256)"

      - name: Replace coming-soon registry with installable artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('registry/depositamo.json')
          d = json.loads(p.read_text())
          sha = Path('/tmp/depositamo/sha256').read_text().strip()
          size = int(Path('/tmp/depositamo/size').read_text().strip())
          cert = Path('/tmp/depositamo/cert').read_text().strip()
          url = 'https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/public-artifacts/depositamo/0.1.0/DepositAMO-0.1.0.apk'

          d['status'] = 'candidate'
          d['source'] = {
              'visibility': 'public',
              'repository': 'amoedo7/StoreAMO-Catalog',
              'path': 'rebuild-android/depositamo'
          }
          d['distribution'] = {
              'repository': 'amoedo7/StoreAMO-Catalog',
              'mode': 'direct-artifacts'
          }
          d['store']['notes'] = (
              'DepositAMO 0.1.0 reconstruida desde cero. Guarda textos y archivos localmente, '
              'calcula SHA-256 y conserva historial. APK público directo probado por descarga HTTPS anónima. '
              'Candidate; no se declara Verified.'
          )
          d['artifacts'] = [{
              'platform': 'android',
              'arch': 'universal',
              'format': 'apk',
              'version': '0.1.0',
              'version_code': '1',
              'url': url,
              'sha256': sha,
              'signing_cert_sha256': cert,
              'size_bytes': size,
              'min_os': 'Android 6.0 (API 23)',
              'application_id': 'com.desarrollamo.depositamo',
              'verified': False,
              'verification_report': None,
              'release_url': 'https://github.com/amoedo7/StoreAMO-Catalog/tree/main/public-artifacts/depositamo/0.1.0',
              'source': 'distribution-registry'
          }]
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')
          PY
          python build_catalog.py --owner amoedo7
          python enrich_catalog.py
          python - <<'PY'
          import json
          c=json.load(open('catalog.json'))
          app=next(x for x in c['apps'] if x['id']=='depositamo')
          a=next(x for x in app['artifacts'] if x['platform']=='android')
          assert a['url'].startswith('https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/public-artifacts/depositamo/')
          assert a['application_id']=='com.desarrollamo.depositamo'
          assert len(a['sha256'])==64
          assert a['size_bytes']>1000
          print('DEPOSITAMO_CATALOG_OK', a['url'], a['sha256'], a['size_bytes'])
          PY

      - name: Publish rebuilt APK and catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'StoreAMO Rebuild Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f public-artifacts/depositamo/0.1.0/DepositAMO-0.1.0.apk
          git add registry/depositamo.json catalog.json discovery-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'rebuild: publish DepositAMO from scratch'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Prove anonymous public download
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/public-artifacts/depositamo/0.1.0/DepositAMO-0.1.0.apk'
          EXPECTED="$(cat /tmp/depositamo/sha256)"
          for n in $(seq 1 18); do
            if curl -fsSL --retry 2 --connect-timeout 15 --max-time 60 "$URL" -o /tmp/depositamo/public.apk; then
              ACTUAL="$(sha256sum /tmp/depositamo/public.apk | awk '{print $1}')"
              if [ "$ACTUAL" = "$EXPECTED" ]; then
                unzip -tqq /tmp/depositamo/public.apk
                echo "PUBLIC_DOWNLOAD_OK depositamo $ACTUAL"
                exit 0
              fi
              echo "SHA mismatch $ACTUAL != $EXPECTED"
            fi
            sleep 5
          done
          echo 'PUBLIC_DOWNLOAD_FAILED depositamo' >&2
          exit 1

      - name: Record passing evidence
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          import json, os
          from pathlib import Path
          c=json.load(open('catalog.json'))
          app=next(x for x in c['apps'] if x['id']=='depositamo')
          a=next(x for x in app['artifacts'] if x['platform']=='android')
          evidence={
            'schema':'storeamo.download-proof.v1',
            'result':'PASS',
            'run_id': os.environ.get('GITHUB_RUN_ID'),
            'app': {
              'id':'depositamo',
              'url':a['url'],
              'sha256':a['sha256'],
              'size_bytes':a['size_bytes'],
              'anonymous_download':'PASS',
              'zip':'PASS',
              'signature':'PASS',
              'permissions':'PASS_ZERO',
              'application_id':a['application_id'],
              'launchable_activity':'PASS'
            }
          }
          Path('verification/depositamo-rebuilt.json').write_text(json.dumps(evidence, indent=2)+'\n')
          PY
          git add verification/depositamo-rebuilt.json
          git config user.name 'StoreAMO Rebuild Bot'
          git config user.email 'actions@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'verify: DepositAMO public APK download passes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Record workflow status
        if: always()
        shell: bash
        run: |
          set +e
          git pull --rebase origin main
          mkdir -p verification
          printf 'job_status=%s\nsource_commit=%s\nrun_id=%s\n' '${{ job.status }}' '${{ github.sha }}' '${{ github.run_id }}' > verification/rebuild-depositamo-run-status.txt
          git add verification/rebuild-depositamo-run-status.txt
          git config user.name 'StoreAMO Rebuild Bot'
          git config user.email 'actions@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record DepositAMO rebuild status [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
