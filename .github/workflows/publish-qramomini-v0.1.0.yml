name: publish-qramomini-v0.1.0

on:
  push:
    branches: [agent/qramomini-store-v0.1.0]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download validated QRAMOMini artifact
        env:
          ARTIFACT_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-0440-8243-b2b2-e7bf752bd1ca/raw?se=2026-08-19T21%3A19%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=ed36d3f1-9288-53b6-a727-7191fd44d97f&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-19T07%3A27%3A39Z&ske=2026-08-20T07%3A27%3A39Z&sks=b&skv=2026-02-06&sig=d67PHEhLt5ViSGhH91Azn0ufZqJKCMcCbU0D2U%2B6jDQ%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/qramomini.zip
          mkdir -p /tmp/qramomini
          unzip -q /tmp/qramomini.zip -d /tmp/qramomini
          test -f /tmp/qramomini/QRAMOMini-0.1.0.apk
          test -f /tmp/qramomini/SHA256SUMS.txt
          cd /tmp/qramomini
          sha256sum -c SHA256SUMS.txt
          test "$(sha256sum QRAMOMini-0.1.0.apk | awk '{print $1}')" = "881c6a00f2530e0e34f07f5d518bc3c1053e677f7fc0dba62bd96d032349fc4c"
      - name: Publish public binary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=qramomini-v0.1.0
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/qramomini/QRAMOMini-0.1.0.apk /tmp/qramomini/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" /tmp/qramomini/QRAMOMini-0.1.0.apk /tmp/qramomini/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "QRAMOMini v0.1.0 · StoreAMO binary" \
              --notes "Distribución binaria pública de QRAMOMini 0.1.0 candidate. Código fuente privado. SHA-256 verificado antes de publicar."
          fi
