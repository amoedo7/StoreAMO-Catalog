name: factoryamo-emergency-publish

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.issue.title == 'PUBLISH_FACTORYAMO_0_2_0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reassemble exact APK
        shell: bash
        run: |
          set -euo pipefail
          cat .release-input/factoryamo-0.2.0.part00 \
              .release-input/factoryamo-0.2.0.part01 \
              .release-input/factoryamo-0.2.0.part02 \
              .release-input/factoryamo-0.2.0.part03 \
              .release-input/factoryamo-0.2.0.part04 | base64 -d > /tmp/FactoryAMO-0.2.0.apk
          test "$(stat -c%s /tmp/FactoryAMO-0.2.0.apk)" = '28621'
          test "$(sha256sum /tmp/FactoryAMO-0.2.0.apk | awk '{print $1}')" = '8187bf7a22ffed6a6e23fda935f61e3858c55a22c43c4f3a53196aaf1279a87e'
          unzip -tqq /tmp/FactoryAMO-0.2.0.apk
      - name: Publish exact APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'StoreAMO Artifact Bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          mkdir -p public-artifacts/factoryamo/0.2.0
          cp /tmp/FactoryAMO-0.2.0.apk public-artifacts/factoryamo/0.2.0/FactoryAMO-0.2.0.apk
          git add -f public-artifacts/factoryamo/0.2.0/FactoryAMO-0.2.0.apk
          git commit -m 'artifact(factoryamo): publish exact 0.2.0 mass-production candidate APK' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment 'FactoryAMO 0.2.0 exact artifact published.'
