name: publish-habitamo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-habitamo.yml'
      - 'registry/habitamo.json'
      - '.release-input/habitamo-0.1.0.part*'
      - 'habitamo-publish.trigger'

permissions:
  contents: write

concurrency:
  group: publish-habitamo-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync latest catalog state
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main

      - name: Reconstruct exact CI APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/habitamo
          base64 -d .release-input/habitamo-0.1.0.part00 > artifacts/habitamo/HabitAMO-0.1.0.apk
          test "$(stat -c%s artifacts/habitamo/HabitAMO-0.1.0.apk)" = "14337"
          echo "a449beb69ebfc01df7b1667d9d9619eeb0399479d504b93e25fa2ac30a2869bb  artifacts/habitamo/HabitAMO-0.1.0.apk" | sha256sum -c -
          unzip -tqq artifacts/habitamo/HabitAMO-0.1.0.apk
          echo 'HABITAMO_EXACT_APK_OK'

      - name: Validate StoreAMO registry contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          m=json.loads(pathlib.Path('registry/habitamo.json').read_text())
          assert m['status']=='candidate'
          assert m['source']['visibility']=='private'
          assert m['distribution']['repository']=='amoedo7/StoreAMO-Catalog'
          assert m['distribution']['mode']=='direct-artifacts'
          a=m['artifacts'][0]
          assert a['platform']=='android'
          assert a['version']=='0.1.0'
          assert a['version_code']=='1'
          assert a['application_id']=='com.desarrollamo.habitamo'
          assert a['sha256']=='a449beb69ebfc01df7b1667d9d9619eeb0399479d504b93e25fa2ac30a2869bb'
          assert a['size_bytes']==14337
          assert a['verified'] is False
          assert a['url']=='https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/artifacts/habitamo/HabitAMO-0.1.0.apk'
          print('HABITAMO_REGISTRY_OK')
          PY

      - name: Publish exact APK to public catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'StoreAMO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- artifacts/habitamo/HabitAMO-0.1.0.apk
          if git diff --cached --quiet; then
            echo 'Exact HabitAMO APK already published'
            exit 0
          fi
          git commit -m 'dist: publish exact HabitAMO 0.1.0 APK'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final local integrity proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s artifacts/habitamo/HabitAMO-0.1.0.apk)" = "14337"
          echo "a449beb69ebfc01df7b1667d9d9619eeb0399479d504b93e25fa2ac30a2869bb  artifacts/habitamo/HabitAMO-0.1.0.apk" | sha256sum -c -
          echo 'HABITAMO_PUBLIC_DIRECT_ARTIFACT_OK'
