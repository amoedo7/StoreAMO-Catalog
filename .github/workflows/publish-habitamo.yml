name: publish-habitamo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - habitamo-publish.trigger

permissions:
  contents: write

concurrency:
  group: publish-habitamo-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Reconstruct and verify APK
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release-input/habitamo-0.1.0.part00 > /tmp/HabitAMO-0.1.0.apk
          test "$(stat -c%s /tmp/HabitAMO-0.1.0.apk)" = "14337"
          echo "a449beb69ebfc01df7b1667d9d9619eeb0399479d504b93e25fa2ac30a2869bb  /tmp/HabitAMO-0.1.0.apk" | sha256sum -c -

      - name: Publish public distribution release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='habitamo-v0.1.0'
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "HabitAMO v0.1.0" --notes "Candidate de distribución StoreAMO. Source privado; APK público verificado por SHA-256. Sin permiso INTERNET."
          gh release upload "$TAG" /tmp/HabitAMO-0.1.0.apk#HabitAMO-0.1.0.apk --clobber

      - name: Validate registry contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          m=json.loads(pathlib.Path('registry/habitamo.json').read_text())
          assert m['status']=='candidate'
          assert m['source']['visibility']=='private'
          assert m['distribution']['mode']=='direct-artifacts'
          a=m['artifacts'][0]
          assert a['version']=='0.1.0'
          assert a['version_code']=='1'
          assert a['application_id']=='com.desarrollamo.habitamo'
          assert a['sha256']=='a449beb69ebfc01df7b1667d9d9619eeb0399479d504b93e25fa2ac30a2869bb'
          assert a['size_bytes']==14337
          assert a['verified'] is False
          assert a['url'].startswith('https://github.com/amoedo7/StoreAMO-Catalog/releases/download/')
          print('HABITAMO_REGISTRY_OK')
          PY
