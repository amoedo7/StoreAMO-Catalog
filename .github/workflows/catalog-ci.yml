name: catalog-ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: catalog-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STOREAMO_VERIFY_SHA: 8dc7c9298bedac14a71899d10d8a4218e5b9ea7d

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate pinned Android signers
        run: python scripts/validate_android_signing_pins.py
      - name: Fetch pinned StoreAMO verifier
        run: |
          git clone --no-checkout https://github.com/amoedo7/StoreAMO-Verify.git /tmp/storeamo-verify
          git -C /tmp/storeamo-verify checkout --detach "$STOREAMO_VERIFY_SHA"
          test "$(git -C /tmp/storeamo-verify rev-parse HEAD)" = "$STOREAMO_VERIFY_SHA"
      - name: Validate catalog
        run: python /tmp/storeamo-verify/verify_catalog.py catalog.json
