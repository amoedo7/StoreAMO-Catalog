name: catalog-ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch StoreAMO verifier
        run: git clone --depth 1 https://github.com/amoedo7/StoreAMO-Verify.git /tmp/storeamo-verify
      - name: Validate catalog
        run: python /tmp/storeamo-verify/verify_catalog.py catalog.json
      - name: Inspect TemporizAMO public artifact
        shell: bash
        run: |
          set -euo pipefail
          APK='artifacts/temporizamo/TemporizAMO-0.1.0.apk'
          echo "SIZE=$(stat -c %s "$APK")"
          echo "SHA256=$(sha256sum "$APK" | awk '{print $1}')"
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/temporizamo/TemporizAMO-0.1.0.apk')
          data = p.read_bytes()
          assert data.startswith(b'PK'), 'not an APK/ZIP'
          needle = 'com.desarrollamo.temporizamo'.encode('utf-16le')
          assert needle in data, 'application_id not found in APK resources'
          print('APPLICATION_ID=com.desarrollamo.temporizamo')
          PY
