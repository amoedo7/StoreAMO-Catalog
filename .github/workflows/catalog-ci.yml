name: catalog-ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch StoreAMO verifier
        run: git clone --depth 1 https://github.com/amoedo7/StoreAMO-Verify.git /tmp/storeamo-verify
      - name: Validate catalog
        run: python /tmp/storeamo-verify/verify_catalog.py catalog.json
      - name: Verify public APK downloads
        run: python verify_artifact_downloads.py catalog.json
