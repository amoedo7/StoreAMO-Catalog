name: build-climaamo-020-famo-20260822-201753-13807

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: climaamo-020-famo-20260822-201753-13807
  cancel-in-progress: false

jobs:
  build-verify-publish:
    if: github.event_name != 'issues' || github.event.issue.title == 'BUILD_CLIMAAMO_020_FAMO_20260822_201753_13807'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 35 build tools
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and APK build
        working-directory: factoryamo-builds/FAMO-20260822-201753-13807/ClimaAMO
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Verify exact Open-Meteo fields used by ClimaAMO
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse, urllib.request
          q = urllib.parse.urlencode({'name':'Pergamino','count':1,'language':'es','format':'json'})
          geo = json.load(urllib.request.urlopen('https://geocoding-api.open-meteo.com/v1/search?' + q, timeout=15))
          assert geo.get('results'), geo
          p = geo['results'][0]
          params = {
              'latitude': p['latitude'], 'longitude': p['longitude'],
              'current': 'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,pressure_msl,surface_pressure,wind_speed_10m,wind_direction_10m,wind_gusts_10m',
              'hourly': 'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,cloud_cover,visibility,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day',
              'daily': 'weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,sunrise,sunset,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,uv_index_max',
              'timezone':'auto','forecast_days':5,
          }
          url = 'https://api.open-meteo.com/v1/forecast?' + urllib.parse.urlencode(params)
          data = json.load(urllib.request.urlopen(url, timeout=20))
          assert len(data['daily']['time']) == 5
          assert len(data['hourly']['time']) >= 12
          for key in ('temperature_2m','relative_humidity_2m','weather_code','wind_speed_10m'):
              assert key in data['current']
          for key in ('precipitation_probability','visibility','pressure_msl','wind_gusts_10m'):
              assert key in data['hourly']
          for key in ('uv_index_max','sunrise','sunset','precipitation_sum'):
              assert key in data['daily']
          print('OPEN_METEO_REAL_DATA_OK', p['name'], p.get('admin1'), p.get('country'))
          PY

      - name: Inspect APK identity signature and permissions
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          APK='factoryamo-builds/FAMO-20260822-201753-13807/ClimaAMO/app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          test -s "$APK"
          unzip -tqq "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='com.desarrollamo.climaamo' versionCode='2' versionName='0.2.0'"
          echo "$BADGING" | grep -q "sdkVersion:'26'"
          echo "$BADGING" | grep -q "targetSdkVersion:'35'"
          PERMS="$("$AAPT" dump permissions "$APK")"
          echo "$PERMS" | grep -q 'android.permission.INTERNET'
          EXTRA="$(echo "$PERMS" | grep 'uses-permission' | grep -v 'android.permission.INTERNET' || true)"
          test -z "$EXTRA" || { echo "Unexpected permissions: $EXTRA"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test -n "$CERT"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Publish candidate artifact verification and StoreAMO registry
        env:
          CERT: ${{ steps.inspect.outputs.cert }}
          SHA: ${{ steps.inspect.outputs.sha }}
          SIZE: ${{ steps.inspect.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          APK='factoryamo-builds/FAMO-20260822-201753-13807/ClimaAMO/app/build/outputs/apk/debug/app-debug.apk'
          DEST='public-artifacts/climaamo/0.2.0'
          mkdir -p "$DEST" verification-reports registry
          cp "$APK" "$DEST/ClimaAMO-0.2.0.apk"
          printf '%s\n' "$SHA" > "$DEST/sha256.txt"
          python - <<'PY'
          import json, os
          sha=os.environ['SHA']; cert=os.environ['CERT']; size=int(os.environ['SIZE'])
          artifact='https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/public-artifacts/climaamo/0.2.0/ClimaAMO-0.2.0.apk'
          report={
            'schema':'storeamo.verification-report.v1','app_id':'climaamo','version':'0.2.0','version_code':'2',
            'application_id':'com.desarrollamo.climaamo','artifact_url':artifact,'sha256':sha,'size_bytes':size,
            'signing_cert_sha256':cert,'verified':False,
            'checks':{
              'integrity':{'status':'PASS','evidence':'APK built by CI, non-empty, ZIP integrity passed and SHA-256 recorded.'},
              'application_id':{'status':'PASS','evidence':'Packaged APK is com.desarrollamo.climaamo, versionCode 2, versionName 0.2.0, minSdk 26, targetSdk 35.'},
              'signature':{'status':'PASS','evidence':'APK signature verifies and certificate SHA-256 was recorded for this candidate build.'},
              'permissions':{'status':'PASS','evidence':'Packaged manifest declares only android.permission.INTERNET.'},
              'tests':{'status':'PASS','evidence':'JUnit tests and assembleDebug completed before artifact publication.'},
              'https':{'status':'PASS','evidence':'The exact Open-Meteo geocoding and forecast field sets used by ClimaAMO returned valid real data during CI.'},
              'device_smoke':{'status':'NOT_RUN','evidence':'0.2.0 still requires a physical Android smoke test before StoreAMO Verified.'}
            }
          }
          open('verification-reports/climaamo-v0.2.0.json','w').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          manifest={
            'schema':'storeamo.app.v1','id':'climaamo','name':'ClimaAMO',
            'tagline':'Clima actual, próximas horas y 5 días sin cuentas ni claves.',
            'description':'ClimaAMO 0.2.0 amplía la consulta por ciudad con condiciones actuales, 12 horas, lluvia, viento, ráfagas, humedad, presión, visibilidad, nubosidad, amanecer, atardecer, UV, detalle diario y tendencias de temperatura y humedad/lluvia. Todos los valores provienen de Open-Meteo por HTTPS; no usa datos simulados, cuenta ni API key.',
            'category':'Clima','audience':'public','featured':False,'status':'candidate','supported_platforms':['android'],
            'source':{'visibility':'public','repository':'https://github.com/amoedo7/StoreAMO-Catalog/tree/main/factoryamo-builds/FAMO-20260822-201753-13807/ClimaAMO'},
            'store':{'homepage':'https://desarrollamo.com.ar','screenshots':[],
              'notes':'ClimaAMO 0.2.0 candidate. Fuente Open-Meteo Forecast API. Sólo INTERNET. Device smoke pendiente. El signer de 0.1.0 fue efímero, por lo que la migración a esta candidate puede requerir una desinstalación única.'},
            'verification':{'policy':'storeamo-default-v1','required_checks':['integrity','application-id','signature','permissions','tests','https','device-smoke']},
            'artifacts':[{'platform':'android','arch':'universal','format':'apk','version':'0.2.0','version_code':'2','url':artifact,
              'sha256':sha,'size_bytes':size,'min_os':'Android 8.0 (API 26)','application_id':'com.desarrollamo.climaamo',
              'signing_cert_sha256':cert,'verified':False,'verification_report':'https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/verification-reports/climaamo-v0.2.0.json',
              'release_url':'https://github.com/amoedo7/StoreAMO-Catalog/tree/main/public-artifacts/climaamo/0.2.0','source':'distribution-registry'}]
          }
          open('registry/climaamo.json','w').write(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY
          python build_catalog.py --owner amoedo7
          python enrich_catalog.py
          git config user.name 'FactoryAMO Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$DEST/ClimaAMO-0.2.0.apk" "$DEST/sha256.txt" verification-reports/climaamo-v0.2.0.json registry/climaamo.json catalog.json discovery-report.json
          git commit -m 'release(climaamo): publish 0.2.0 real-data candidate'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Close trigger issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment 'ClimaAMO 0.2.0 build, verification and StoreAMO candidate publication completed.'
