name: build-climaamo-famo-20260822-201753-13807

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: factoryamo-020-emergency-publish
  cancel-in-progress: false

jobs:
  publish-factoryamo:
    if: github.event_name != 'issues' || github.event.issue.title == 'BUILD_CLIMAAMO_FAMO_20260822_201753_13807'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reassemble and verify FactoryAMO 0.2.0
        shell: bash
        run: |
          set -euo pipefail
          for p in 00 01 02 03 04; do test -f ".release-input/factoryamo-0.2.0.part${p}"; done
          cat .release-input/factoryamo-0.2.0.part00 \
              .release-input/factoryamo-0.2.0.part01 \
              .release-input/factoryamo-0.2.0.part02 \
              .release-input/factoryamo-0.2.0.part03 \
              .release-input/factoryamo-0.2.0.part04 | base64 -d > /tmp/FactoryAMO-0.2.0.apk
          test "$(stat -c%s /tmp/FactoryAMO-0.2.0.apk)" = '28621'
          test "$(sha256sum /tmp/FactoryAMO-0.2.0.apk | awk '{print $1}')" = '8187bf7a22ffed6a6e23fda935f61e3858c55a22c43c4f3a53196aaf1279a87e'
          unzip -tqq /tmp/FactoryAMO-0.2.0.apk
      - name: Publish exact verified APK
        shell: bash
        run: |
          set -euo pipefail
          DEST='public-artifacts/factoryamo/0.2.0'
          mkdir -p "$DEST"
          cp /tmp/FactoryAMO-0.2.0.apk "$DEST/FactoryAMO-0.2.0.apk"
          printf '%s\n' '8187bf7a22ffed6a6e23fda935f61e3858c55a22c43c4f3a53196aaf1279a87e' > "$DEST/sha256.txt"
          git config user.name 'StoreAMO Artifact Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$DEST/FactoryAMO-0.2.0.apk" "$DEST/sha256.txt"
          git commit -m 'artifact(factoryamo): publish exact 0.2.0 mass-production candidate APK' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Close trigger issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment 'FactoryAMO 0.2.0 exact artifact publication completed.'
