name: build-climaamo-famo-20260822-201753-13807

on:
  push:
    branches: [main]
    paths:
      - 'factoryamo-builds/FAMO-20260822-201753-13807/ClimaAMO/**'
      - '.github/workflows/build-climaamo-famo-20260822-201753-13807.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: climaamo-famo-20260822-201753-13807
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and debug build
        working-directory: factoryamo-builds/FAMO-20260822-201753-13807/ClimaAMO
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='factoryamo-builds/FAMO-20260822-201753-13807/ClimaAMO/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -tqq "$APK"
          sha256sum "$APK"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClimaAMO-0.1.0-debug-apk
          path: factoryamo-builds/FAMO-20260822-201753-13807/ClimaAMO/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish verified candidate artifact into catalog repo
        shell: bash
        run: |
          set -euo pipefail
          SRC='factoryamo-builds/FAMO-20260822-201753-13807/ClimaAMO/app/build/outputs/apk/debug/app-debug.apk'
          DEST='public-artifacts/climaamo/0.1.0'
          mkdir -p "$DEST"
          cp "$SRC" "$DEST/ClimaAMO-0.1.0.apk"
          sha256sum "$DEST/ClimaAMO-0.1.0.apk" | awk '{print $1}' > "$DEST/sha256.txt"
          git config user.name 'FactoryAMO Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$DEST/ClimaAMO-0.1.0.apk" "$DEST/sha256.txt"
          git commit -m 'artifact(climaamo): publish verified 0.1.0 candidate APK' || true
          git pull --rebase origin main
          git push origin HEAD:main
