name: publish-calculamo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calculamo-publish.yml'
      - '.release-input/calculamo-0.1.0.part*'

permissions:
  contents: write

concurrency:
  group: publish-calculamo-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct and verify preserved APK
        shell: bash
        run: |
          set -euo pipefail
          cat .release-input/calculamo-0.1.0.part* | base64 -d > /tmp/CalculAMO-0.1.0.apk
          test "$(stat -c%s /tmp/CalculAMO-0.1.0.apk)" = "12793"
          echo "021eb4dcd8cf845d89d0153eba1eb08fe4f399a9c9cf31676b13301931bb39ef  /tmp/CalculAMO-0.1.0.apk" | sha256sum -c -
          unzip -tqq /tmp/CalculAMO-0.1.0.apk

      - name: Publish raw APK and switch StoreAMO to direct raw URL
        shell: bash
        run: |
          set -euo pipefail
          DEST='public-artifacts/calculamo/0.1.0/CalculAMO-0.1.0.apk'
          mkdir -p "$(dirname "$DEST")"
          cp /tmp/CalculAMO-0.1.0.apk "$DEST"
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('registry/calculamo.json')
          d=json.loads(p.read_text())
          a=d['artifacts'][0]
          a['url']='https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/public-artifacts/calculamo/0.1.0/CalculAMO-0.1.0.apk'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+'\n')
          PY
          git config user.name 'StoreAMO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DEST" registry/calculamo.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: serve CalculAMO APK from raw GitHub'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Rebuild catalog with raw APK URL
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python build_catalog.py --owner amoedo7
          python enrich_catalog.py
          python - <<'PY'
          import json
          c=json.load(open('catalog.json'))
          a=next(x for x in c['apps'] if x['id']=='calculamo')['artifacts'][0]
          assert a['url']=='https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/public-artifacts/calculamo/0.1.0/CalculAMO-0.1.0.apk'
          assert a['sha256']=='021eb4dcd8cf845d89d0153eba1eb08fe4f399a9c9cf31676b13301931bb39ef'
          PY
          git add catalog.json discovery-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'catalog: use raw CalculAMO APK URL'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
