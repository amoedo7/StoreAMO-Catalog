name: publish-calculamo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calculamo-publish.yml'
      - 'registry/calculamo.json'
      - '.release-input/calculamo-0.1.0.part*'

permissions:
  contents: write

concurrency:
  group: publish-calculamo-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cat .release-input/calculamo-0.1.0.part* | base64 -d > /tmp/CalculAMO-0.1.0.apk
          test "$(stat -c%s /tmp/CalculAMO-0.1.0.apk)" = "12793"
          echo "021eb4dcd8cf845d89d0153eba1eb08fe4f399a9c9cf31676b13301931bb39ef  /tmp/CalculAMO-0.1.0.apk" | sha256sum -c -
          unzip -tqq /tmp/CalculAMO-0.1.0.apk

      - name: Publish public distribution release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='calculamo-v0.1.0'
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "CalculAMO v0.1.0" --notes "Candidate de distribución StoreAMO. Source privado; APK público verificado por SHA-256."
          gh release upload "$TAG" /tmp/CalculAMO-0.1.0.apk#CalculAMO-0.1.0.apk --clobber

      - name: Verify anonymous public download
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/amoedo7/StoreAMO-Catalog/releases/download/calculamo-v0.1.0/CalculAMO-0.1.0.apk'
          curl -fL --retry 5 --retry-delay 2 --retry-all-errors "$URL" -o /tmp/CalculAMO-public.apk
          test "$(stat -c%s /tmp/CalculAMO-public.apk)" = "12793"
          echo "021eb4dcd8cf845d89d0153eba1eb08fe4f399a9c9cf31676b13301931bb39ef  /tmp/CalculAMO-public.apk" | sha256sum -c -
          unzip -tqq /tmp/CalculAMO-public.apk
          cmp -s /tmp/CalculAMO-0.1.0.apk /tmp/CalculAMO-public.apk
          echo 'CALCULAMO_PUBLIC_APK_OK'

      - name: Validate registry contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re
          m=json.loads(pathlib.Path('registry/calculamo.json').read_text())
          assert m['status']=='candidate'
          assert m['source']['visibility']=='private'
          assert m['distribution']['repository']=='amoedo7/StoreAMO-Catalog'
          assert m['distribution']['mode']=='direct-artifacts'
          a=m['artifacts'][0]
          assert a['platform']=='android'
          assert a['version']=='0.1.0'
          assert a['version_code']=='1'
          assert a['application_id']=='com.desarrollamo.calculamo'
          assert a['sha256']=='021eb4dcd8cf845d89d0153eba1eb08fe4f399a9c9cf31676b13301931bb39ef'
          assert a['size_bytes']==12793
          assert a['url']=='https://github.com/amoedo7/StoreAMO-Catalog/releases/download/calculamo-v0.1.0/CalculAMO-0.1.0.apk'
          assert re.fullmatch(r'[0-9a-f]{64}', a.get('signing_cert_sha256',''))
          assert a['verified'] is False
          print('CALCULAMO_REGISTRY_OK')
          PY

      - name: Rebuild catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python build_catalog.py --owner amoedo7
          python enrich_catalog.py
          python - <<'PY'
          import json, re
          c=json.load(open('catalog.json'))
          a=next(x for x in c['apps'] if x['id']=='calculamo')
          assert a['status']=='candidate'
          assert a['source_visibility']=='private'
          x=next(x for x in a['artifacts'] if x['platform']=='android')
          assert x['version']=='0.1.0'
          assert x['version_code']=='1'
          assert x['application_id']=='com.desarrollamo.calculamo'
          assert x['url'].startswith('https://github.com/amoedo7/StoreAMO-Catalog/releases/download/')
          assert re.fullmatch(r'[0-9a-f]{64}', x['sha256'])
          assert x['sha256']=='021eb4dcd8cf845d89d0153eba1eb08fe4f399a9c9cf31676b13301931bb39ef'
          assert x['size_bytes']==12793
          print('STOREAMO_CALCULAMO_OK')
          PY

      - name: Commit refreshed catalog
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- catalog.json discovery-report.json; then
            echo 'Catalog already current'
            exit 0
          fi
          git config user.name 'StoreAMO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add catalog.json discovery-report.json
          git commit -m 'catalog: publish CalculAMO 0.1.0 candidate'
          git pull --rebase origin main
          git push origin HEAD:main
