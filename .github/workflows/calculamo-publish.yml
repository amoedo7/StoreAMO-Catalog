name: publish-calculamo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calculamo-publish.yml'
      - '.release-input/calculamo-0.1.0.part*'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/calculamo-publish.yml'

permissions:
  contents: write

concurrency:
  group: publish-calculamo-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct and verify preserved APK
        shell: bash
        run: |
          set -euo pipefail
          cat .release-input/calculamo-0.1.0.part* | base64 -d > /tmp/CalculAMO-0.1.0.apk
          test "$(stat -c%s /tmp/CalculAMO-0.1.0.apk)" = "12793"
          echo "021eb4dcd8cf845d89d0153eba1eb08fe4f399a9c9cf31676b13301931bb39ef  /tmp/CalculAMO-0.1.0.apk" | sha256sum -c -
          unzip -tqq /tmp/CalculAMO-0.1.0.apk

      - name: Publish immutable raw artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B publication origin/main
          DEST='public-artifacts/calculamo/0.1.0/CalculAMO-0.1.0.apk'
          mkdir -p "$(dirname "$DEST")"
          cp /tmp/CalculAMO-0.1.0.apk "$DEST"
          echo "021eb4dcd8cf845d89d0153eba1eb08fe4f399a9c9cf31676b13301931bb39ef  $DEST" | sha256sum -c -
          unzip -tqq "$DEST"
          git config user.name 'StoreAMO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- "$DEST"
          if git diff --cached --quiet; then
            echo 'Public artifact already current'
            exit 0
          fi
          git commit -m 'artifact: publish CalculAMO 0.1.0'
          git push origin HEAD:main
