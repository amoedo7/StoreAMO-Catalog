name: publish-calculamo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calculamo-publish.yml'
      - '.release-input/calculamo-0.1.0.part*'

permissions:
  contents: write

concurrency:
  group: publish-calculamo-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reconstruct and verify APK
        run: |
          set -euo pipefail
          cat .release-input/calculamo-0.1.0.part* | base64 -d > /tmp/CalculAMO-0.1.0.apk
          test "$(stat -c%s /tmp/CalculAMO-0.1.0.apk)" = "12793"
          echo "021eb4dcd8cf845d89d0153eba1eb08fe4f399a9c9cf31676b13301931bb39ef  /tmp/CalculAMO-0.1.0.apk" | sha256sum -c -
          unzip -tqq /tmp/CalculAMO-0.1.0.apk
      - name: Publish public distribution release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='calculamo-v0.1.0'
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title 'CalculAMO v0.1.0' --notes 'Candidate de distribución StoreAMO.'
          gh release upload "$TAG" /tmp/CalculAMO-0.1.0.apk#CalculAMO-0.1.0.apk --clobber
      - name: Verify public download
        run: |
          set -euo pipefail
          curl -fL --retry 5 'https://github.com/amoedo7/StoreAMO-Catalog/releases/download/calculamo-v0.1.0/CalculAMO-0.1.0.apk' -o /tmp/public.apk
          echo "021eb4dcd8cf845d89d0153eba1eb08fe4f399a9c9cf31676b13301931bb39ef  /tmp/public.apk" | sha256sum -c -
          unzip -tqq /tmp/public.apk
