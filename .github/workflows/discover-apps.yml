# StoreAMO discovery v3: catalog + public activity feed; private sources remain sanitized. Refresh canonical WebAMO 0.1.2 signer.
name: discover-apps

on:
  workflow_dispatch:
  push:
    paths:
      - build_catalog.py
      - build_news.py
      - enrich_catalog.py
      - tests/test_build_news.py
      - registry/**
      - schemas/storeamo.app.v1.schema.json
      - .github/workflows/discover-apps.yml
  pull_request:
    paths:
      - build_catalog.py
      - build_news.py
      - enrich_catalog.py
      - tests/test_build_news.py
      - registry/**
      - schemas/storeamo.app.v1.schema.json
      - .github/workflows/discover-apps.yml

permissions:
  contents: write

concurrency:
  group: storeamo-catalog-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test Buenas Nuevas generator
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Discover public manifests and sanitized registry entries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_catalog.py --owner amoedo7
      - name: Preserve audience metadata
        run: python enrich_catalog.py
      - name: Build Buenas Nuevas feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STOREAMO_NEWS_TOKEN: ${{ secrets.STOREAMO_NEWS_TOKEN }}
        run: python build_news.py --owner amoedo7
      - name: Validate generated catalog and news
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          c = json.loads(Path('catalog.json').read_text())
          assert c['schema'] == 'storeamo.catalog.v1'
          assert c.get('catalog_version', 0) >= 3
          assert isinstance(c['apps'], list)
          ids = [x['id'] for x in c['apps']]
          assert len(ids) == len(set(ids))
          for app in c['apps']:
              assert app['source_manifest'].startswith('https://raw.githubusercontent.com/amoedo7/')
              assert app.get('audience', 'public') in {'public', 'team', 'system'}
              assert app.get('source_visibility', 'public') in {'public', 'private'}
              for a in app.get('artifacts', []):
                  assert a['url'].startswith('https://')
                  assert len(a['sha256']) == 64
                  cert = a.get('signing_cert_sha256')
                  if cert:
                      assert len(cert) == 64

          n = json.loads(Path('news.json').read_text())
          assert n['schema'] == 'storeamo.news.v1'
          assert isinstance(n['items'], list)
          assert len(n['items']) <= 120
          for item in n['items']:
              assert item['app_id'] in ids
              assert item['source_visibility'] in {'public', 'private'}
              assert item['title'] and item['published_at']
          print('CATALOG_OK', len(c['apps']), 'NEWS_OK', len(n['items']))
          PY
      - name: Commit catalog and news changes
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- catalog.json discovery-report.json news.json; then
            echo 'No catalog/news changes'
            exit 0
          fi
          git config user.name 'StoreAMO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add catalog.json discovery-report.json news.json
          git commit -m 'chore: refresh StoreAMO catalog and Buenas Nuevas'
          git push
