name: publish-gastamo-041

on:
  push:
    branches: [main]
    paths:
      - .staging/gastamo041/READY

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reconstruct exact validated APK
        shell: bash
        run: |
          set -euo pipefail
          test -f .staging/gastamo041/READY
          test "$(find .staging/gastamo041 -name 'chunk*.b64' -type f | wc -l)" = "4"
          cat .staging/gastamo041/chunk*.b64 | base64 -d > /tmp/GastAMO-0.4.1.apk
          test "$(stat -c%s /tmp/GastAMO-0.4.1.apk)" = "55509"
          test "$(sha256sum /tmp/GastAMO-0.4.1.apk | awk '{print $1}')" = "478a9b4b4abdf0cadfa776f36612f20c2f789fe546e3aa66623da62e0dafcf24"
          unzip -tqq /tmp/GastAMO-0.4.1.apk
          mkdir -p public-artifacts/gastamo/0.4.1
          cp /tmp/GastAMO-0.4.1.apk public-artifacts/gastamo/0.4.1/GastAMO-0.4.1.apk
      - name: Commit immutable public artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'StoreAMO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -r .staging/gastamo041
          git add public-artifacts/gastamo/0.4.1/GastAMO-0.4.1.apk
          git commit -m 'release: publish GastAMO 0.4.1 immutable APK'
          git pull --rebase origin main
          git push origin HEAD:main
