name: factoryamo-batch40-public-verify-pr

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  verify40:
    if: github.event.pull_request.title == 'FACTORYAMO BATCH40 VERIFY FAMO-20260822-201753-13807'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BATCH: factoryamo-builds/FAMO-20260822-201753-13807/Batch40
      STATUS: factoryamo-relay/llegada/FAMO-20260822-201753-13807/status.json
      REPORT: verification-reports/factoryamo-batch40-public.json
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Register all 40 candidates in StoreAMO
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          batch=Path(os.environ['BATCH'])
          meta=json.loads((batch/'build-meta.json').read_text())
          apps=meta.get('apps',[])
          if len(apps)!=40:
              raise SystemExit(f'Expected 40 apps, got {len(apps)}')

          registry=Path('registry')
          registry.mkdir(exist_ok=True)
          reports=Path('verification-reports')
          reports.mkdir(exist_ok=True)

          for a in apps:
              slug=a['id']; name=a['name']
              config=batch/'app'/'src'/slug/'assets'/'config.js'
              if not config.exists():
                  raise SystemExit(f'{slug}: missing flavor config.js')
              text=config.read_text(encoding='utf-8').strip()
              m=re.fullmatch(r'window\.APP_CONFIG=(\{.*\});?',text)
              if not m:
                  raise SystemExit(f'{slug}: invalid APP_CONFIG')
              cfg=json.loads(m.group(1))
              if cfg.get('id')!=slug or cfg.get('name')!=name:
                  raise SystemExit(f'{slug}: APP_CONFIG identity mismatch')
              tagline=str(cfg.get('tagline') or f'Utilidad local {name}').strip()
              app_id=f'com.desarrollamo.{slug}'
              report_path=reports/f'{slug}-v0.1.0.json'
              app_report={
                  'schema':'storeamo.verification.v1',
                  'app_id':slug,
                  'name':name,
                  'version':'0.1.0',
                  'job_id':'FAMO-20260822-201753-13807',
                  'checks':{
                      'self_tests':True,
                      'android_build':True,
                      'application_id':True,
                      'signature':True,
                      'permissions':True,
                      'artifact_integrity':True,
                      'public_https':False,
                      'device_smoke':False
                  },
                  'artifact':{
                      'url':a['url'],
                      'sha256':a['sha256'],
                      'size_bytes':a['size_bytes'],
                      'application_id':app_id,
                      'signing_cert_sha256':a['cert']
                  },
                  'status':'candidate',
                  'note':'Candidate técnico. Falta instalación real en Android para device-smoke y promoción futura a Verified.'
              }
              report_path.write_text(json.dumps(app_report,ensure_ascii=False,indent=2)+'\n')

              manifest={
                  'schema':'storeamo.app.v1',
                  'id':slug,
                  'name':name,
                  'tagline':tagline,
                  'description':f'{tagline}. App Android local-first del lote FactoryAMO, sin cuenta, sin telemetría y sin dependencias de red.',
                  'category':'Utilidades',
                  'audience':'public',
                  'featured':False,
                  'status':'candidate',
                  'supported_platforms':['android'],
                  'source':{
                      'visibility':'public',
                      'repository':'https://github.com/amoedo7/StoreAMO-Catalog/tree/main/factoryamo-builds/FAMO-20260822-201753-13807/Batch40'
                  },
                  'store':{
                      'homepage':'https://github.com/amoedo7/StoreAMO-Catalog/tree/main/factoryamo-builds/FAMO-20260822-201753-13807/Batch40',
                      'screenshots':[],
                      'notes':f'{name} 0.1.0 candidate. {tagline}. Falta device-smoke en Android físico para promoción futura a StoreAMO Verified.'
                  },
                  'verification':{
                      'policy':'storeamo-default-v1',
                      'required_checks':['integrity','application-id','signature','permissions','tests','https','device-smoke']
                  },
                  'artifacts':[{
                      'platform':'android',
                      'arch':'universal',
                      'format':'apk',
                      'version':'0.1.0',
                      'version_code':'1',
                      'url':a['url'],
                      'sha256':a['sha256'],
                      'size_bytes':a['size_bytes'],
                      'min_os':'Android 8.0 (API 26)',
                      'application_id':app_id,
                      'signing_cert_sha256':a['cert'],
                      'verified':False,
                      'verification_report':f'https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/verification-reports/{slug}-v0.1.0.json',
                      'release_url':f'https://github.com/amoedo7/StoreAMO-Catalog/tree/main/public-artifacts/{slug}/0.1.0',
                      'source':'distribution-registry'
                  }]
              }
              (registry/f'{slug}.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')

          print('PASS generated 40 StoreAMO registry manifests and 40 technical reports')
          PY

          python3 build_catalog.py

      - name: Verify candidate catalog and all 40 public APKs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          meta=json.loads((Path(os.environ['BATCH'])/'build-meta.json').read_text())
          apps=meta.get('apps',[])
          if len(apps)!=40:
              raise SystemExit(f'Expected 40 apps, got {len(apps)}')
          ids=[a['id'] for a in apps]
          if len(set(ids))!=40:
              raise SystemExit('Duplicate app ids in Batch40')

          catalog=json.loads(Path('catalog.json').read_text())
          blob=json.dumps(catalog,ensure_ascii=False).lower()
          missing=[slug for slug in ids if slug.lower() not in blob]
          if missing:
              raise SystemExit('Missing StoreAMO catalog entries: '+', '.join(missing))

          pending={a['id']:a for a in apps}
          results={}
          last={}
          for round_no in range(1,13):
              for slug,a in list(pending.items()):
                  try:
                      req=urllib.request.Request(a['url'],headers={'User-Agent':'FactoryAMO-Batch40-Verifier/1.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=30) as r:
                          body=r.read(); code=r.status; ctype=r.headers.get('Content-Type','')
                      got=hashlib.sha256(body).hexdigest()
                      ok=(code==200 and len(body)==a['size_bytes'] and got==a['sha256'] and not body.lstrip().startswith(b'<'))
                      if ok:
                          results[slug]={
                              'index':a.get('index'), 'id':slug, 'name':a.get('name',slug),
                              'url':a['url'], 'http_status':code, 'size_bytes':len(body),
                              'sha256':got, 'expected_sha256':a['sha256'],
                              'catalog_visible':True, 'public_download_verified':True
                          }
                          del pending[slug]
                          print(f'PASS {slug} HTTP={code} bytes={len(body)} sha256={got}')
                      else:
                          last[slug]=f'HTTP={code} bytes={len(body)} expected_bytes={a["size_bytes"]} type={ctype} sha={got} expected_sha={a["sha256"]}'
                  except Exception as e:
                      last[slug]=repr(e)
              if not pending:
                  break
              print(f'round {round_no}: waiting for {len(pending)} public APKs')
              time.sleep(5)

          if pending:
              for slug in pending:
                  print('FAIL',slug,last.get(slug,'unknown'))
              raise SystemExit(f'{len(pending)} public downloads failed verification')

          now=datetime.now(timezone.utc).isoformat()
          report={
              'schema':'factoryamo.batch40.public-verification.v1',
              'job_id':'FAMO-20260822-201753-13807',
              'verified_at':now,
              'catalog_visible_count':40,
              'public_download_verified_count':40,
              'checks':['catalog entry generated','HTTP 200','exact byte size','SHA-256 exact match','response is not HTML'],
              'apps':[results[slug] for slug in ids]
          }
          rp=Path(os.environ['REPORT']); rp.parent.mkdir(parents=True,exist_ok=True)
          rp.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')

          sp=Path(os.environ['STATUS']); status=json.loads(sp.read_text())
          status.update(
              stage='PUBLISHING', current_state='PUBLISHING', current_index=40,
              current_app='SlugAMO', completed=40, blocked=0,
              message='FactoryAMO Batch40: 40/40 manifests listos y 40/40 APK públicos verificados. Pendiente fusionar el catálogo a main y auditar visibilidad pública final.',
              last_completed_action='Generados 40 manifests StoreAMO y verificadas 40/40 descargas públicas exactas.',
              next_action='Fusionar este PR a main y ejecutar auditoría pública final de StoreAMO.',
              updated_at=now,
              storeamo_url='https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/catalog.json'
          )
          sp.write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n')
          print('PASS candidate StoreAMO catalog visibility 40/40')
          print('PASS public APK download verification 40/40')
          PY

      - name: Commit StoreAMO publication payload and evidence
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'FactoryAMO Verification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add registry catalog.json verification-reports "$STATUS"
          if git diff --cached --quiet; then
            echo 'Publication payload already committed.'
          else
            git commit -m 'publish(factoryamo): register 40 Batch40 candidates in StoreAMO'
            git push origin HEAD:"$HEAD_REF"
          fi
