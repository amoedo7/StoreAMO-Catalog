name: factoryamo-batch40-public-verify-pr

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  verify40:
    if: github.event.pull_request.title == 'FACTORYAMO BATCH40 VERIFY FAMO-20260822-201753-13807'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BATCH: factoryamo-builds/FAMO-20260822-201753-13807/Batch40
      STATUS: factoryamo-relay/llegada/FAMO-20260822-201753-13807/status.json
      REPORT: verification-reports/factoryamo-batch40-public.json
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check whether verification is already complete
        id: existing
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          p=Path(os.environ['REPORT'])
          done=False
          if p.exists():
              try:
                  d=json.loads(p.read_text())
                  done=(d.get('catalog_visible_count')==40 and d.get('public_download_verified_count')==40 and len(d.get('apps',[]))==40)
              except Exception:
                  pass
          print('done='+('true' if done else 'false'))
          PY

      - name: Verify StoreAMO catalog and all 40 public APKs
        if: steps.existing.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          meta=json.loads((Path(os.environ['BATCH'])/'build-meta.json').read_text())
          apps=meta.get('apps',[])
          if len(apps)!=40:
              raise SystemExit(f'Expected 40 apps, got {len(apps)}')
          ids=[a['id'] for a in apps]
          if len(set(ids))!=40:
              raise SystemExit('Duplicate app ids in Batch40')

          catalog=json.loads(Path('catalog.json').read_text())
          blob=json.dumps(catalog,ensure_ascii=False).lower()
          missing=[slug for slug in ids if slug.lower() not in blob]
          if missing:
              raise SystemExit('Missing StoreAMO catalog entries: '+', '.join(missing))

          pending={a['id']:a for a in apps}
          results={}
          last={}
          for round_no in range(1,13):
              for slug,a in list(pending.items()):
                  try:
                      req=urllib.request.Request(a['url'],headers={'User-Agent':'FactoryAMO-Batch40-Verifier/1.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=30) as r:
                          body=r.read(); code=r.status; ctype=r.headers.get('Content-Type','')
                      got=hashlib.sha256(body).hexdigest()
                      ok=(code==200 and len(body)==a['size_bytes'] and got==a['sha256'] and not body.lstrip().startswith(b'<'))
                      if ok:
                          results[slug]={
                              'index':a.get('index'), 'id':slug, 'name':a.get('name',slug),
                              'url':a['url'], 'http_status':code, 'size_bytes':len(body),
                              'sha256':got, 'expected_sha256':a['sha256'],
                              'catalog_visible':True, 'public_download_verified':True
                          }
                          del pending[slug]
                          print(f'PASS {slug} HTTP={code} bytes={len(body)} sha256={got}')
                      else:
                          last[slug]=f'HTTP={code} bytes={len(body)} expected_bytes={a["size_bytes"]} type={ctype} sha={got} expected_sha={a["sha256"]}'
                  except Exception as e:
                      last[slug]=repr(e)
              if not pending:
                  break
              print(f'round {round_no}: waiting for {len(pending)} public APKs')
              time.sleep(5)

          if pending:
              for slug in pending:
                  print('FAIL',slug,last.get(slug,'unknown'))
              raise SystemExit(f'{len(pending)} public downloads failed verification')

          now=datetime.now(timezone.utc).isoformat()
          report={
              'schema':'factoryamo.batch40.public-verification.v1',
              'job_id':'FAMO-20260822-201753-13807',
              'verified_at':now,
              'catalog_visible_count':40,
              'public_download_verified_count':40,
              'checks':['catalog entry present','HTTP 200','exact byte size','SHA-256 exact match','response is not HTML'],
              'apps':[results[slug] for slug in ids]
          }
          rp=Path(os.environ['REPORT']); rp.parent.mkdir(parents=True,exist_ok=True)
          rp.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')

          sp=Path(os.environ['STATUS']); status=json.loads(sp.read_text())
          status.update(
              stage='PUBLISHED', current_state='PUBLISHED', current_index=40,
              current_app='SlugAMO', completed=40, blocked=0,
              message='FactoryAMO Batch40 completado: 40/40 apps visibles en StoreAMO y 40/40 APK públicos verificados por HTTPS, tamaño y SHA-256.',
              last_completed_action='Verificadas 40/40 entradas de catálogo y 40/40 descargas públicas exactas.',
              next_action='Instalar los candidates desde StoreAMO en el dispositivo Android para aportar el device-smoke real.',
              updated_at=now,
              storeamo_url='https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/catalog.json'
          )
          sp.write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n')
          print('PASS StoreAMO catalog visibility 40/40')
          print('PASS public APK download verification 40/40')
          PY

      - name: Commit verification evidence to PR branch
        if: steps.existing.outputs.done != 'true'
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'FactoryAMO Verification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$REPORT" "$STATUS"
          git commit -m 'verify(factoryamo): confirm Batch40 StoreAMO visibility and downloads'
          git push origin HEAD:"$HEAD_REF"
