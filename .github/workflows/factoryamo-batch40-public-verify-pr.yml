name: factoryamo-batch40-public-verify-pr

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  verify40:
    if: github.event.pull_request.title == 'FACTORYAMO BATCH40 VERIFY FAMO-20260822-201753-13807'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BATCH: factoryamo-builds/FAMO-20260822-201753-13807/Batch40
      STATUS: factoryamo-relay/llegada/FAMO-20260822-201753-13807/status.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check whether the 40 staged APKs already exist
        id: staged
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json, os
          from pathlib import Path
          meta_path=Path(os.environ['BATCH'])/'build-meta.json'
          ready=False
          if meta_path.exists():
              try:
                  apps=json.loads(meta_path.read_text()).get('apps',[])
                  ready=len(apps)==40
                  for a in apps:
                      p=Path(a['apk'])
                      if not p.exists():
                          ready=False; break
                      body=p.read_bytes()
                      if len(body)!=a['size_bytes'] or hashlib.sha256(body).hexdigest()!=a['sha256']:
                          ready=False; break
              except Exception:
                  ready=False
          print('ready='+('true' if ready else 'false'))
          PY

      - uses: actions/setup-java@v5
        if: steps.staged.outputs.ready != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        if: steps.staged.outputs.ready != 'true'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.staged.outputs.ready != 'true'
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK
        if: steps.staged.outputs.ready != 'true'
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Compile all 40 Android variants
        if: steps.staged.outputs.ready != 'true'
        working-directory: factoryamo-builds/FAMO-20260822-201753-13807/Batch40
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Package the 40 APKs into public-artifacts and rebuild StoreAMO
        if: steps.staged.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          python3 -u "$BATCH/generate.py" package
          python3 build_catalog.py
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path(os.environ['STATUS']); d=json.loads(p.read_text())
          d.update(
              stage='PUBLISHING', current_state='PUBLISHING', current_index=40,
              current_app='SlugAMO', completed=40, blocked=0,
              message='FactoryAMO Batch40: 40/40 APK empaquetados y 40/40 entradas StoreAMO preparadas. Pendiente merge a main para la verificación HTTPS pública final.',
              last_completed_action='Compilados y empaquetados los 40 APK dentro de public-artifacts; catálogo reconstruido.',
              next_action='Fusionar a main y verificar 40/40 descargas públicas por HTTP 200, tamaño y SHA-256.',
              updated_at=datetime.now(timezone.utc).isoformat()
          )
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Validate all 40 staged APKs and catalog entries locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          meta=json.loads((Path(os.environ['BATCH'])/'build-meta.json').read_text())
          apps=meta.get('apps',[])
          if len(apps)!=40:
              raise SystemExit(f'Expected 40 apps, got {len(apps)}')
          ids=[a['id'] for a in apps]
          if len(set(ids))!=40:
              raise SystemExit('Duplicate app ids')
          catalog=json.loads(Path('catalog.json').read_text())
          blob=json.dumps(catalog,ensure_ascii=False).lower()
          for a in apps:
              p=Path(a['apk'])
              if not p.exists():
                  raise SystemExit(f"Missing staged APK: {p}")
              body=p.read_bytes(); got=hashlib.sha256(body).hexdigest()
              if len(body)!=a['size_bytes'] or got!=a['sha256']:
                  raise SystemExit(f"Integrity mismatch: {a['id']}")
              if a['id'].lower() not in blob:
                  raise SystemExit(f"Missing catalog entry: {a['id']}")
              if not body.startswith(b'PK'):
                  raise SystemExit(f"Not an APK ZIP: {a['id']}")
              print(f"PASS {a['id']} bytes={len(body)} sha256={got}")
          print('PASS staged StoreAMO catalog entries 40/40')
          print('PASS staged APK integrity 40/40')
          PY

      - name: Commit publication payload to PR branch
        if: steps.staged.outputs.ready != 'true'
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'FactoryAMO Publication Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$BATCH" registry verification-reports catalog.json "$STATUS"
          git add -f public-artifacts
          if git diff --cached --quiet; then
            echo 'No publication changes to commit.'
          else
            git commit -m 'publish(factoryamo): stage 40 Batch40 APKs for StoreAMO'
            git push origin HEAD:"$HEAD_REF"
          fi
