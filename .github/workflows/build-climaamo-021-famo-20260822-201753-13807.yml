name: build-climaamo-021-famo-20260822-201753-13807

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: climaamo-021-famo-20260822-201753-13807
  cancel-in-progress: false

jobs:
  build-verify-publish:
    if: github.event_name != 'issues' || github.event.issue.title == 'BUILD_CLIMAAMO_021_FAMO_20260822_201753_13807'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Prepare canonical candidate signer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/amoedo7/StoreAMO/3f5009e0226c948469f0277f4571d5413b7133ba/ci/storeamo-debug.keystore.b64' | base64 -d > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Tests and build
        working-directory: factoryamo-builds/FAMO-20260822-201753-13807/ClimaAMO
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Verify live data providers
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          lat,lon=55.6761,12.5683
          ua='ClimaAMO/0.2.1 https://desarrollamo.com.ar'
          def get(url):
            r=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'application/json'})
            return json.load(urllib.request.urlopen(r,timeout=20))
          om=get('https://api.open-meteo.com/v1/forecast?'+urllib.parse.urlencode({'latitude':lat,'longitude':lon,'current':'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,pressure_msl,surface_pressure,wind_speed_10m,wind_direction_10m,wind_gusts_10m','hourly':'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,cloud_cover,visibility,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day','daily':'weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,sunrise,sunset,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,uv_index_max','timezone':'auto','forecast_days':5}))
          assert len(om['daily']['time'])==5 and len(om['hourly']['time'])>=24
          met=get('https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=55.6761&lon=12.5683')
          assert met['properties']['timeseries']
          aq=get('https://air-quality-api.open-meteo.com/v1/air-quality?'+urllib.parse.urlencode({'latitude':lat,'longitude':lon,'current':'european_aqi,us_aqi,pm10,pm2_5,ozone','timezone':'auto'}))
          assert aq.get('current')
          print('CLIMAAMO_021_REAL_PROVIDERS_PASS')
          PY
      - name: Inspect APK
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          APK='factoryamo-builds/FAMO-20260822-201753-13807/ClimaAMO/app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"; APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"; unzip -tqq "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='com.desarrollamo.climaamo' versionCode='3' versionName='0.2.1'"
          echo "$BADGING" | grep -q "sdkVersion:'26'"; echo "$BADGING" | grep -q "targetSdkVersion:'35'"
          PERMS="$("$AAPT" dump permissions "$APK")"
          for p in INTERNET ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION; do echo "$PERMS" | grep -q "android.permission.$p"; done
          test "$(echo "$PERMS" | grep -c '^uses-permission:')" = '3'
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f')"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"; SIZE="$(stat -c%s "$APK")"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"; echo "sha=$SHA" >> "$GITHUB_OUTPUT"; echo "size=$SIZE" >> "$GITHUB_OUTPUT"
      - name: Publish StoreAMO candidate
        env:
          CERT: ${{ steps.inspect.outputs.cert }}
          SHA: ${{ steps.inspect.outputs.sha }}
          SIZE: ${{ steps.inspect.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          APK='factoryamo-builds/FAMO-20260822-201753-13807/ClimaAMO/app/build/outputs/apk/debug/app-debug.apk'
          DEST='public-artifacts/climaamo/0.2.1'; mkdir -p "$DEST" verification-reports registry
          cp "$APK" "$DEST/ClimaAMO-0.2.1.apk"; printf '%s\n' "$SHA" > "$DEST/sha256.txt"
          python - <<'PY'
          import json,os
          sha=os.environ['SHA']; cert=os.environ['CERT']; size=int(os.environ['SIZE'])
          artifact='https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/public-artifacts/climaamo/0.2.1/ClimaAMO-0.2.1.apk'
          report={'schema':'storeamo.verification-report.v1','app_id':'climaamo','version':'0.2.1','version_code':'3','application_id':'com.desarrollamo.climaamo','artifact_url':artifact,'sha256':sha,'size_bytes':size,'signing_cert_sha256':cert,'verified':False,'checks':{
            'integrity':{'status':'PASS','evidence':'CI built APK, ZIP integrity and SHA-256 passed.'},
            'application_id':{'status':'PASS','evidence':'com.desarrollamo.climaamo versionCode 3 versionName 0.2.1 minSdk 26 targetSdk 35.'},
            'signature':{'status':'PASS','evidence':'APK signature verifies with pinned canonical candidate signer.'},
            'permissions':{'status':'PASS','evidence':'Only INTERNET, ACCESS_COARSE_LOCATION and ACCESS_FINE_LOCATION; location is requested only after the user taps Aquí.'},
            'tests':{'status':'PASS','evidence':'JUnit tests and assembleDebug passed.'},
            'https':{'status':'PASS','evidence':'Live contract checks passed for Open-Meteo Forecast, Open-Meteo Air Quality and MET Norway Locationforecast.'},
            'no_simulation':{'status':'PASS','evidence':'UI uses provider response values or N/D; secondary provider failures are not replaced by invented data.'},
            'device_smoke':{'status':'NOT_RUN','evidence':'Physical GPS/day-navigation smoke test remains required for StoreAMO Verified.'}}}
          open('verification-reports/climaamo-v0.2.1.json','w').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          manifest={'schema':'storeamo.app.v1','id':'climaamo','name':'ClimaAMO','tagline':'Clima real aquí o en cualquier ciudad, hora por hora y a 5 días.','description':'ClimaAMO 0.2.1 agrega ubicación Aquí por GPS/red bajo permiso explícito, detalle interactivo de cada uno de los 5 días y sus horas, comparación separada Open-Meteo/MET Norway y calidad del aire real con AQI, PM2.5, PM10 y ozono. No promedia fuentes ni simula valores: cada dato proviene de una respuesta real o se muestra N/D.','category':'Clima','audience':'public','featured':False,'status':'candidate','supported_platforms':['android'],'source':{'visibility':'public','repository':'https://github.com/amoedo7/StoreAMO-Catalog/tree/main/factoryamo-builds/FAMO-20260822-201753-13807/ClimaAMO'},'store':{'homepage':'https://desarrollamo.com.ar','screenshots':[],'notes':'0.2.1 candidate. Ubicación sólo al tocar Aquí. Fuentes: Open-Meteo Forecast/Air Quality y MET Norway. 0.2.0 usó un signer CI efímero; 0.2.1 inicia la línea candidate canónica y requiere una última reinstalación desde 0.2.0. Device smoke pendiente.'},'verification':{'policy':'storeamo-default-v1','required_checks':['integrity','application-id','signature','permissions','tests','https','no-simulation','device-smoke']},'artifacts':[{'platform':'android','arch':'universal','format':'apk','version':'0.2.1','version_code':'3','url':artifact,'sha256':sha,'size_bytes':size,'min_os':'Android 8.0 (API 26)','application_id':'com.desarrollamo.climaamo','signing_cert_sha256':cert,'verified':False,'verification_report':'https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/verification-reports/climaamo-v0.2.1.json','release_url':'https://github.com/amoedo7/StoreAMO-Catalog/tree/main/public-artifacts/climaamo/0.2.1','source':'distribution-registry'}]}
          open('registry/climaamo.json','w').write(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          p='android-signing-pins.json'; data=json.load(open(p)); data.setdefault('packages',{})['com.desarrollamo.climaamo']={'app_id':'climaamo','canonical_cert_sha256':cert,'canonical_since_version':'0.2.1','legacy_certificates':[{'cert_sha256':'af77602ce2f9c5452fe302ff57b9f5c576971e110886f97e6bce04b020f2dd78','last_version':'0.2.0','reason':'legacy CI debug signer; private key was ephemeral and was not preserved','migration':'one_time_reinstall_required'}]}; open(p,'w').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          python build_catalog.py --owner amoedo7; python enrich_catalog.py
          git config user.name 'FactoryAMO Build Bot'; git config user.email 'actions@users.noreply.github.com'
          git add -f "$DEST/ClimaAMO-0.2.1.apk" "$DEST/sha256.txt" verification-reports/climaamo-v0.2.1.json registry/climaamo.json android-signing-pins.json catalog.json discovery-report.json
          git commit -m 'release(climaamo): publish 0.2.1 candidate'
          git pull --rebase origin main; git push origin HEAD:main
      - name: Close trigger
        if: github.event_name == 'issues'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh issue close "${{ github.event.issue.number }}" --comment 'ClimaAMO 0.2.1 candidate published after build, real-provider and package verification.'
