name: repair-gastamo-apk

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-gastamo-apk.yml
      - repair-gastamo-apk.trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download exact GastAMO 0.3.0 CI artifact
        shell: bash
        run: |
          set -euo pipefail
          URL='https://sdmntprukwest.oaiusercontent.com/files/00000000-57ec-8243-a906-ac5d08777b17/raw?se=2026-08-24T11%3A51%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=03d4265a-0f9b-5921-8c64-c310102975d4&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-24T06%3A14%3A01Z&ske=2026-08-25T06%3A14%3A01Z&sks=b&skv=2026-02-06&sig=9%2B/IDHPukt3MezBpQXkuK6A%2BlDDKQJkLaXjplWKHWCA%3D'
          curl -fL --retry 4 --retry-all-errors --connect-timeout 15 "$URL" -o /tmp/gastamo-artifact.zip
          rm -rf /tmp/gastamo && mkdir -p /tmp/gastamo
          unzip -q /tmp/gastamo-artifact.zip -d /tmp/gastamo
          APK=/tmp/gastamo/GastAMO-0.3.0.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" = '36785'
          test "$(sha256sum "$APK" | awk '{print $1}')" = 'ac2cda9e0812af0bd362eb4618e49cdf3bce9f86fc2cbfe42cf5dbc6c412654d'
          unzip -tqq "$APK"
          cp "$APK" .release-input/GastAMO-0.3.0.apk

      - uses: android-actions/setup-android@v3

      - name: Verify package and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;35.0.0" >/dev/null
          APK='.release-input/GastAMO-0.3.0.apk'
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee /tmp/gastamo-badging.txt
          grep -q "package: name='com.desarrollamo.gastamo' versionCode='3' versionName='0.3.0'" /tmp/gastamo-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/gastamo-signing.txt
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/gastamo-signing.txt | head -n1 | tr 'A-F' 'a-f')"
          test "$CERT" = '14a55d450502f9b391acf55e483ec736b60afed832a02d8feba70b0fbce711ca'
          "$AAPT" dump permissions "$APK" | tee /tmp/gastamo-permissions.txt
          ! grep -q '^uses-permission:' /tmp/gastamo-permissions.txt

      - name: Keep registry metadata aligned to exact bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('registry/gastamo.json')
          data=json.loads(p.read_text())
          a=data['artifacts'][0]
          a['version']='0.3.0'
          a['version_code']='3'
          a['url']='https://raw.githubusercontent.com/amoedo7/StoreAMO-Catalog/main/.release-input/GastAMO-0.3.0.apk'
          a['sha256']='ac2cda9e0812af0bd362eb4618e49cdf3bce9f86fc2cbfe42cf5dbc6c412654d'
          a['size_bytes']=36785
          a['application_id']='com.desarrollamo.gastamo'
          a['signing_cert_sha256']='14a55d450502f9b391acf55e483ec736b60afed832a02d8feba70b0fbce711ca'
          a['verified']=False
          a['verification_report']=None
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Commit repaired staged APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'StoreAMO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .release-input/GastAMO-0.3.0.apk registry/gastamo.json
          if git diff --cached --quiet; then
            echo 'GastAMO 0.3.0 APK already exact'
            exit 0
          fi
          git commit -m 'fix: replace truncated GastAMO 0.3.0 APK with exact CI build'
          git pull --rebase origin main
          git push origin HEAD:main
